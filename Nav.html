<nav class="page-nav">
  <a data-page="home">Home</a>
  <a data-page="standings">Standings</a>
  <a data-page="admin">Admin</a>
  <a data-page="operator">Operator</a>
  <a data-page="display">Display</a>
</nav>
<style>
  .page-nav {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .page-nav a {
    padding: 5px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .page-nav a:hover {
    background: var(--bg-subtle);
    color: var(--brand-orange-dark);
  }
  .page-nav a.active {
    background: var(--brand-orange);
    color: #fff;
  }
</style>
<script>
  (function () {
    // Highlight the current page immediately.
    var NAV_PAGE = new URLSearchParams(window.location.search).get('page') || 'home';
    document.querySelectorAll('.page-nav [data-page]').forEach(function (a) {
      if (a.getAttribute('data-page') === NAV_PAGE) a.classList.add('active');
    });

    // HtmlService sandboxes pages in a googleusercontent.com iframe. Relative
    // ?page= hrefs navigate the inner iframe rather than the outer
    // script.google.com window, producing a blank screen. We need the outer
    // page's URL so we can drive `window.top.location.href` to the right
    // /dev or /exec deployment.
    //
    // The iframe's `document.referrer` IS the top frame's URL (set by Apps
    // Script when it loads us), so we can derive the deployment URL purely
    // client-side. This stays correct whether the user is on /dev or /exec —
    // no server call, no localStorage cache that can drift.
    function _wireNav(appUrl) {
      document.querySelectorAll('.page-nav [data-page]').forEach(function (a) {
        var pg = a.getAttribute('data-page');
        a.addEventListener('click', function (e) {
          e.preventDefault();
          window.top.location.href = appUrl + '?page=' + pg;
        });
      });
    }
    var ref = document.referrer || '';
    var m = ref.match(/^(.+\/macros\/(?:s\/[^/]+|[^/]+)\/(?:dev|exec))/);
    if (m && m[1]) {
      _wireNav(m[1]);
    } else if (typeof google !== 'undefined' && google.script && google.script.run) {
      // Fallback if referrer is missing for some reason — ask the server.
      google.script.run.withSuccessHandler(_wireNav).getAppUrl();
    }
  }());
</script>

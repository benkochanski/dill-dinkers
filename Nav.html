<nav class="page-nav">
  <a data-page="leagues">Leagues</a>
  <a data-page="seasons">Seasons</a>
  <a data-page="players">Players</a>
  <a data-page="display" data-newtab="1">Display ↗</a>
  <a data-page="admin" class="secondary-link">Admin</a>
</nav>
<style>
  .page-nav {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    padding: 8px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .page-nav a {
    padding: 5px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .page-nav a:hover {
    background: var(--bg-subtle);
    color: var(--brand-orange-dark);
  }
  .page-nav a.active {
    background: var(--brand-orange);
    color: #fff;
  }
  .page-nav a.secondary-link {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 12px;
    opacity: 0.75;
  }
  .page-nav a.secondary-link:hover { opacity: 1; }
</style>
<script>
  (function () {
    var URL_PARAMS = new URLSearchParams(window.location.search);
    var NAV_PAGE = URL_PARAMS.get('page') || 'home';

    document.querySelectorAll('.page-nav [data-page]').forEach(function (a) {
      if (a.getAttribute('data-page') === NAV_PAGE) a.classList.add('active');
    });

    // HtmlService sandboxes pages in a googleusercontent.com iframe. Relative
    // ?page= hrefs navigate the inner iframe rather than the outer
    // script.google.com window. Derive the outer URL from referrer.
    function _wireNav(appUrl) {
      document.querySelectorAll('.page-nav [data-page]').forEach(function (a) {
        var pg = a.getAttribute('data-page');
        a.addEventListener('click', function (e) {
          e.preventDefault();
          // The TV scoreboard opens in a NEW tab so the staff page stays put.
          if (a.getAttribute('data-newtab')) {
            window.open(appUrl + '?page=' + pg, '_blank');
          } else {
            window.top.location.href = appUrl + '?page=' + pg;
          }
        });
      });
    }
    var ref = document.referrer || '';
    var m = ref.match(/^(.+\/macros\/(?:s\/[^/]+|[^/]+)\/(?:dev|exec))/);
    if (m && m[1]) {
      _wireNav(m[1]);
    } else if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(_wireNav).getAppUrl();
    }
  }());
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1628">
<title>Dill Dinkers Leagues</title>
<meta name="description" content="Live standings, schedules and results for Dill Dinkers pickleball leagues.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1628; --bg-elev: #112038; --card: #142035; --card-hover: #1a2944;
    --border: #1f2f4a; --border-soft: #182640;
    --text: #fff; --text-muted: #8a98ad; --text-dim: #5d6a7e;
    --orange: #F58220; --orange-dim: #D86A0F; --orange-soft: rgba(245,130,32,.15);
    --green: #8DC63F; --green-dim: #6FA82A; --red: #ff5252; --red-soft: rgba(255,82,82,.15);
    --gold: #ffd54a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.45; }
  .num { font-family: 'Roboto Mono', monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--orange); text-decoration: none; }
  a:hover { color: var(--text); }
  button { font-family: inherit; }

  .topbar { background: linear-gradient(180deg, #112038 0%, #0a1628 100%); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 18px; position: sticky; top: 0; z-index: 50; }
  .topbar .logo { font-weight: 900; font-size: 18px; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .topbar .logo .accent { color: var(--orange); }
  .topbar nav { margin-left: auto; display: flex; gap: 22px; }
  .topbar nav a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 16px; margin-bottom: -16px; border-bottom: 2px solid transparent; }
  .topbar nav a:hover { color: var(--text); }
  .topbar nav a.active { color: var(--orange); border-bottom-color: var(--orange); }

  .appfoot { padding: 24px; text-align: center; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); margin-top: 48px; }

  .section { padding: 24px; max-width: 1280px; margin: 0 auto; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 16px; flex-wrap: wrap; gap: 8px; }
  .section-h h2 { margin: 0; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-muted); }

  .hero { padding: 36px 24px 24px; border-bottom: 1px solid var(--border); background: radial-gradient(circle at top right, rgba(245,130,32,0.10), transparent 40%), var(--bg); }
  .hero-inner { max-width: 1280px; margin: 0 auto; }
  .hero h1 { margin: 0 0 6px; font-size: 32px; font-weight: 900; letter-spacing: -0.02em; }
  .hero h1 .accent { color: var(--orange); }
  .hero .sub { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }

  .league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .league-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; cursor: pointer; transition: all 0.12s; position: relative; overflow: hidden; text-decoration: none; color: inherit; display: block; }
  .league-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--orange); opacity: 0.5; transition: opacity 0.12s, width 0.12s; }
  .league-card:hover { background: var(--card-hover); border-color: var(--orange); color: inherit; }
  .league-card:hover::before { opacity: 1; width: 4px; }
  .league-card .day { font-size: 10px; font-weight: 800; color: var(--orange); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
  .league-card h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .league-card .meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .league-card .meta .dot { color: var(--text-dim); }

  .badge { display: inline-block; padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .badge.partner { background: var(--orange-soft); color: var(--orange); }
  .badge.ladder { background: rgba(141,198,63,0.15); color: var(--green); }

  .league-header { background: linear-gradient(135deg, #142035 0%, #0a1628 100%); border-bottom: 1px solid var(--border); padding: 32px 24px 0; }
  .league-header-inner { max-width: 1280px; margin: 0 auto; }
  .crumb { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .crumb a { color: var(--orange); text-decoration: none; }
  .crumb a:hover { color: var(--text); }
  .league-header h1 { margin: 0 0 6px; font-size: 32px; font-weight: 900; letter-spacing: -0.025em; }
  .league-header .meta-row { display: flex; gap: 20px; margin: 12px 0 24px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
  .league-header .meta-row span { display: flex; align-items: center; gap: 6px; }
  .league-header .meta-row .label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; font-weight: 700; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin: 0; overflow-x: auto; }
  .tab { padding: 14px 22px; color: var(--text-muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; text-decoration: none; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--orange); }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .panel-h { padding: 12px 16px; background: var(--bg-elev); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-h h3 { margin: 0; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
  .panel-h .pill { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }

  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--bg-elev); color: var(--text-dim); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th.r { text-align: right; }
  thead th.c { text-align: center; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); font-size: 14px; vertical-align: middle; }
  tbody td.r { text-align: right; }
  tbody td.c { text-align: center; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.row-link { cursor: pointer; }
  tbody tr.row-link:hover { background: var(--card-hover); }

  .rank-cell { font-family: 'Roboto Mono', monospace; font-weight: 800; color: var(--orange); font-size: 16px; width: 36px; }
  .rank-1 { color: var(--gold); }
  .rank-2, .rank-3 { color: var(--orange); }
  .team-cell { font-weight: 700; font-size: 14px; }
  .team-cell a { color: var(--text); }
  .team-cell a:hover { color: var(--orange); }
  .team-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }

  .wl { font-family: 'Roboto Mono', monospace; font-weight: 700; }
  .pos { color: var(--green); font-weight: 700; }
  .neg { color: var(--red); font-weight: 700; }
  .muted { color: var(--text-muted); }

  .loading { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .err { padding: 16px; background: var(--red-soft); border: 1px solid var(--red); border-radius: 4px; color: var(--red); font-size: 14px; margin: 16px 0; }
  .empty { padding: 48px 24px; text-align: center; color: var(--text-muted); font-size: 14px; background: var(--card); border: 1px dashed var(--border); border-radius: 4px; }

  .two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .league-header h1 { font-size: 26px; }
    .hero h1 { font-size: 26px; }
  }

  .weekly-table th, .weekly-table td { padding: 10px 8px; text-align: center; }
  .weekly-table th:first-child, .weekly-table td:first-child { text-align: left; padding-left: 14px; }
  .weekly-table td:first-child { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; }
  .weekly-table .week-w { color: var(--green); font-family: 'Roboto Mono', monospace; font-weight: 600; }
  .weekly-table .week-l { color: var(--red); font-family: 'Roboto Mono', monospace; font-weight: 600; }
  .weekly-table .week-x { color: var(--text-dim); }

  .section-card { margin-bottom: 16px; }

  .score { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; }
  .score-win { color: var(--green); }
  .score-loss { color: var(--text-muted); }

  .pill-badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .pill-badge.win { background: rgba(141,198,63,0.15); color: var(--green); }
  .pill-badge.loss { background: rgba(255,82,82,0.15); color: var(--red); }
  .pill-badge.scheduled { background: var(--bg-elev); color: var(--text-muted); }

  .stat-block { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 18px; }
  .stat-block .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); font-weight: 700; }
  .stat-block .stat-val { font-size: 22px; font-weight: 800; margin-top: 2px; }

  .week-header-row { padding: 14px 16px 4px; background: var(--bg-elev); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>

<script>
//-- CONFIG ---------------------------------------------------------------
// Apps Script /exec URL exposing the public JSON endpoint at ?page=json.
const API_BASE = 'https://script.google.com/macros/s/AKfycbzlOpsp2a5Gg84wWkmvO_9BwAtSictsz3xWjTS7wZ2NNa563uYca-M1TQTv55a-s0OCiQ/exec';

//-- API ------------------------------------------------------------------
async function api(action, params = {}) {
  const url = new URL(API_BASE);
  url.searchParams.set('page', 'json');
  url.searchParams.set('action', action);
  for (const [k, v] of Object.entries(params)) {
    if (v != null && v !== '') url.searchParams.set(k, String(v));
  }
  const res = await fetch(url.toString(), { redirect: 'follow' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const body = await res.json();
  if (!body.ok) throw new Error(body.error || 'Unknown error');
  return body.data;
}

//-- UTIL -----------------------------------------------------------------
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wl = (w, l) => `${w ?? 0}–${l ?? 0}`;
const plusMinus = (n) => n == null ? '0' : (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');
const batPct = (n) => {
  if (n == null || isNaN(n)) return '.000';
  const v = n.toFixed(3);
  return v.startsWith('0') ? v.slice(1) : v;
};
const shortDate = (s) => {
  if (!s) return '';
  const d = new Date(s + 'T12:00:00');
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
};

const rankCls = (r) => r === 1 ? 'rank-cell rank-1' : (r === 2 || r === 3) ? 'rank-cell rank-2' : 'rank-cell';

function shell(body) {
  return `
    <div class="topbar">
      <a href="#/" class="logo">DILL<span class="accent">·</span>DINKERS</a>
      <nav><a href="#/" class="active">Leagues</a></nav>
    </div>
    <main>${body}</main>
    <footer class="appfoot">Dill Dinkers Pickleball &middot; Live league standings &middot; Updated from the operator console</footer>
  `;
}

function leagueHeader(league, currentTab) {
  const tabs = [
    { name: 'Standings', tab: '' },
    { name: 'Schedule', tab: 'schedule' },
    { name: 'Match Results', tab: 'results' },
    ...(league.format_type === 'partner' ? [{ name: 'Teams', tab: 'teams' }] : [])
  ];
  return `
    <div class="league-header"><div class="league-header-inner">
      <div class="crumb"><a href="#/">All Leagues</a> / ${esc(league.name)}</div>
      <h1>${esc(league.full_name || league.name)}</h1>
      <div class="meta-row">
        <span><span class="label">Format</span> <span class="badge ${league.format_type}">${league.format_type}</span></span>
        ${league.level ? `<span><span class="label">Level</span> ${esc(league.level)}</span>` : ''}
        ${league.day_of_week ? `<span><span class="label">Schedule</span> ${esc(league.day_of_week)}${league.start_time ? ' · ' + esc(league.start_time) : ''}</span>` : ''}
        ${league.season_label ? `<span><span class="label">Season</span> ${esc(league.season_label)}</span>` : ''}
        ${league.current_week && league.weeks_count ? `<span><span class="label">Week</span> ${league.current_week} of ${league.weeks_count}</span>` : ''}
      </div>
      <div class="tabs">
        ${tabs.map(t => `<a class="tab${t.tab === currentTab ? ' active' : ''}" href="#/${esc(league.slug)}${t.tab ? '/' + t.tab : ''}">${t.name}</a>`).join('')}
      </div>
    </div></div>
  `;
}

//-- VIEWS ----------------------------------------------------------------

async function viewLeagues() {
  render(shell(`<div class="loading">Loading leagues…</div>`));
  let leagues;
  try { leagues = await api('leagues'); }
  catch (e) { return render(shell(`<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }

  const active = leagues.filter(l => l.status === 'active');
  const past = leagues.filter(l => l.status !== 'active');

  const card = (l) => `
    <a class="league-card" href="#/${esc(l.slug)}">
      <div class="day">${esc(l.day_of_week || '')}${l.start_time ? ' · ' + esc(l.start_time) : ''}</div>
      <h3>${esc(l.name)}</h3>
      <div class="meta">
        <span class="badge ${l.format_type}">${l.format_type}</span>
        ${l.level ? `<span>${esc(l.level)}</span>` : ''}
        ${l.current_week && l.weeks_count ? `<span class="dot">·</span><span>Week ${l.current_week} / ${l.weeks_count}</span>` : ''}
      </div>
    </a>`;

  const body = `
    <div class="hero"><div class="hero-inner">
      <div class="sub">Current Season</div>
      <h1>Active <span class="accent">Leagues</span></h1>
    </div></div>
    <div class="section">
      ${active.length ? `
        <div class="section-h"><h2>${active.length} League${active.length === 1 ? '' : 's'} Currently Running</h2></div>
        <div class="league-grid">${active.map(card).join('')}</div>
      ` : ''}
      ${past.length ? `
        <div class="section-h" style="margin-top:32px"><h2>Past Seasons</h2></div>
        <div class="league-grid">${past.map(card).join('')}</div>
      ` : ''}
      ${!active.length && !past.length ? `<div class="empty">No leagues found.</div>` : ''}
    </div>
  `;
  render(shell(body));
}

async function withLeague(slug, action) {
  let leagues;
  try { leagues = await api('leagues'); }
  catch (e) { return render(shell(`<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }
  const league = leagues.find(l => l.slug === slug);
  if (!league) return render(shell(`<div class="section"><div class="err">League not found.</div></div>`));
  await action(league);
}

async function viewStandings(slug) {
  await withLeague(slug, async (league) => {
    render(shell(leagueHeader(league, '') + `<div class="section"><div class="loading">Loading standings…</div></div>`));
    let data;
    try { data = await api('standings', { lid: league.league_id }); }
    catch (e) { return render(shell(leagueHeader(league, '') + `<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }
    const standings = data.standings || [];
    const weekly = data.weekly;
    if (!standings.length) {
      return render(shell(leagueHeader(league, '') + `<div class="section"><div class="empty">No completed games yet — check back after the first session.</div></div>`));
    }

    let body;
    if (league.format_type === 'partner') {
      const standingsRows = standings.map(s => {
        const totalGames = (s.wins || 0) + (s.losses || 0);
        const pctVal = totalGames ? s.wins / totalGames : 0;
        return `<tr class="row-link" onclick="location.hash='#/${esc(league.slug)}/teams/${esc(s.team_id)}'">
          <td class="${rankCls(s.rank)}">${s.rank}</td>
          <td>
            <div class="team-cell"><a href="#/${esc(league.slug)}/teams/${esc(s.team_id)}">${esc(s.team_name)}</a></div>
            ${s.player_1_name || s.player_2_name ? `<div class="team-sub">${esc([s.player_1_name, s.player_2_name].filter(Boolean).join(' · '))}</div>` : ''}
          </td>
          <td class="r wl">${wl(s.wins, s.losses)}</td>
          <td class="r num">${batPct(pctVal)}</td>
          <td class="r num">${s.games_back > 0 ? s.games_back.toFixed(1) : '—'}</td>
          <td class="r ${s.point_diff > 0 ? 'pos' : s.point_diff < 0 ? 'neg' : ''}">${plusMinus(s.point_diff)}</td>
        </tr>`;
      }).join('');

      const weeklyHtml = weekly?.weeks?.length ? `
        <div class="panel">
          <div class="panel-h"><h3>Weekly Record</h3><span class="pill">W–L per session</span></div>
          <table class="weekly-table">
            <thead><tr><th>Team</th>${weekly.weeks.map(w => `<th>W${w}</th>`).join('')}</tr></thead>
            <tbody>${standings.map(s => `
              <tr><td>${esc(s.team_name)}</td>${(weekly.by_team[s.team_id] || []).map(wk =>
                wk.w + wk.l === 0 ? `<td class="week-x">—</td>` :
                wk.w >= wk.l ? `<td class="week-w">${wk.w}–${wk.l}</td>` :
                `<td class="week-l">${wk.w}–${wk.l}</td>`
              ).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>` : '';

      body = `<div class="section"><div class="two-col">
        <div class="panel">
          <div class="panel-h"><h3>Season Standings</h3>
            ${weekly?.weeks?.length ? `<span class="pill">Through Week ${Math.max(...weekly.weeks)}</span>` : ''}
          </div>
          <table>
            <thead><tr><th>#</th><th>Team</th><th class="r">W–L</th><th class="r">PCT</th><th class="r">GB</th><th class="r">+/−</th></tr></thead>
            <tbody>${standingsRows}</tbody>
          </table>
        </div>
        ${weeklyHtml}
      </div></div>`;
    } else {
      // Ladder
      const rows = standings.map(s => `<tr>
        <td class="${rankCls(s.rank)}">${s.rank}</td>
        <td>
          <div class="team-cell">${esc(s.full_name)}</div>
          ${s.level ? `<div class="team-sub">${esc(s.level)}</div>` : ''}
        </td>
        <td class="r wl">${wl(s.wins, s.losses)}</td>
        <td class="r num">${(s.win_pct * 100).toFixed(1)}%</td>
        <td class="r num">${(s.point_pct * 100).toFixed(1)}%</td>
        <td class="r" style="color: var(--orange); font-weight: 800;">${s.score.toFixed(1)}</td>
      </tr>`).join('');
      body = `<div class="section"><div class="panel">
        <div class="panel-h"><h3>Season Standings</h3><span class="pill">Composite Score</span></div>
        <table>
          <thead><tr><th>#</th><th>Player</th><th class="r">W–L</th><th class="r">W%</th><th class="r">P%</th><th class="r">Score</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div></div>`;
    }
    render(shell(leagueHeader(league, '') + body));
  });
}

async function viewSchedule(slug) {
  await withLeague(slug, async (league) => {
    render(shell(leagueHeader(league, 'schedule') + `<div class="section"><div class="loading">Loading schedule…</div></div>`));
    let data;
    try { data = await api('schedule', { lid: league.league_id }); }
    catch (e) { return render(shell(leagueHeader(league, 'schedule') + `<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }
    const weeks = data.weeks || [];
    if (!weeks.length) {
      return render(shell(leagueHeader(league, 'schedule') + `<div class="section"><div class="empty">No schedule has been generated yet.</div></div>`));
    }
    const body = `<div class="section">${weeks.map(wk => `
      <div class="panel section-card">
        <div class="panel-h">
          <h3>Week ${wk.week_number}${wk.play_date ? ' · ' + shortDate(wk.play_date) : ''}</h3>
          <span class="pill">${wk.matches.length} match${wk.matches.length === 1 ? '' : 'es'}${wk.skip ? ' (skip)' : ''}</span>
        </div>
        ${!wk.matches.length ? `<div style="padding:16px; color: var(--text-muted); font-size: 13px;">No matches.</div>` : `
          <table>
            <thead><tr><th class="c">Round</th><th class="c">Court</th><th>Team 1</th><th class="c">Score</th><th>Team 2</th></tr></thead>
            <tbody>${wk.matches.map(m => `
              <tr>
                <td class="c muted">${m.round}</td>
                <td class="c muted">${m.court ?? '—'}</td>
                <td class="team-cell">${m.t1_team_id ? `<a href="#/${esc(league.slug)}/teams/${esc(m.t1_team_id)}">${esc(m.t1_name)}</a>` : esc(m.t1_name)}</td>
                <td class="c">${m.played ? `
                  <span class="score ${m.t1_score > m.t2_score ? 'score-win' : m.t1_score < m.t2_score ? 'score-loss' : ''}">${m.t1_score}</span>
                  <span class="muted"> – </span>
                  <span class="score ${m.t2_score > m.t1_score ? 'score-win' : m.t2_score < m.t1_score ? 'score-loss' : ''}">${m.t2_score}</span>
                ` : `<span class="pill-badge scheduled">Scheduled</span>`}</td>
                <td class="team-cell">${m.t2_team_id ? `<a href="#/${esc(league.slug)}/teams/${esc(m.t2_team_id)}">${esc(m.t2_name)}</a>` : esc(m.t2_name)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        `}
      </div>`).join('')}</div>`;
    render(shell(leagueHeader(league, 'schedule') + body));
  });
}

async function viewResults(slug) {
  await withLeague(slug, async (league) => {
    render(shell(leagueHeader(league, 'results') + `<div class="section"><div class="loading">Loading results…</div></div>`));
    let data;
    try { data = await api('results', { lid: league.league_id }); }
    catch (e) { return render(shell(leagueHeader(league, 'results') + `<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }
    const results = data.results || [];
    if (!results.length) {
      return render(shell(leagueHeader(league, 'results') + `<div class="section"><div class="empty">No completed games yet.</div></div>`));
    }
    const byWeek = new Map();
    for (const r of results) {
      if (!byWeek.has(r.week)) byWeek.set(r.week, []);
      byWeek.get(r.week).push(r);
    }
    const isPartner = league.format_type === 'partner';
    const body = `<div class="section">${[...byWeek.entries()].map(([week, games]) => `
      <div class="panel section-card">
        <div class="panel-h">
          <h3>Week ${week}${games[0]?.play_date ? ' · ' + shortDate(games[0].play_date) : ''}</h3>
          <span class="pill">${games.length} game${games.length === 1 ? '' : 's'}</span>
        </div>
        <table>
          <thead><tr>
            <th class="c">R</th>${!isPartner ? `<th class="c">Group</th>` : ''}
            <th>Team 1</th><th class="c">Score</th><th>Team 2</th>
          </tr></thead>
          <tbody>${games.map(g => `
            <tr>
              <td class="c muted">${g.round || '—'}</td>
              ${!isPartner ? `<td class="c muted">${g.group ?? '—'}</td>` : ''}
              <td>
                ${g.t1_team_id ? `<div class="team-cell"><a href="#/${esc(league.slug)}/teams/${esc(g.t1_team_id)}">${esc(g.t1_name)}</a></div>` : ''}
                ${g.t1_players?.length ? `<div class="team-sub">${esc(g.t1_players.join(' · '))}</div>` : ''}
              </td>
              <td class="c">
                <span class="score ${g.winner === 1 ? 'score-win' : g.winner === 2 ? 'score-loss' : ''}">${g.t1_score}</span>
                <span class="muted"> – </span>
                <span class="score ${g.winner === 2 ? 'score-win' : g.winner === 1 ? 'score-loss' : ''}">${g.t2_score}</span>
              </td>
              <td>
                ${g.t2_team_id ? `<div class="team-cell"><a href="#/${esc(league.slug)}/teams/${esc(g.t2_team_id)}">${esc(g.t2_name)}</a></div>` : ''}
                ${g.t2_players?.length ? `<div class="team-sub">${esc(g.t2_players.join(' · '))}</div>` : ''}
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`).join('')}</div>`;
    render(shell(leagueHeader(league, 'results') + body));
  });
}

async function viewTeams(slug) {
  await withLeague(slug, async (league) => {
    render(shell(leagueHeader(league, 'teams') + `<div class="section"><div class="loading">Loading teams…</div></div>`));
    let data;
    try { data = await api('teams', { lid: league.league_id }); }
    catch (e) { return render(shell(leagueHeader(league, 'teams') + `<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }
    const teams = data.teams || [];
    if (!teams.length) {
      return render(shell(leagueHeader(league, 'teams') + `<div class="section"><div class="empty">No teams yet.</div></div>`));
    }
    const body = `<div class="section"><div class="league-grid">${teams.map(t => `
      <a class="league-card" href="#/${esc(league.slug)}/teams/${esc(t.team_id)}">
        <div class="day">${t.rank ? '#' + t.rank : 'Unranked'}</div>
        <h3>${esc(t.team_name)}</h3>
        <div class="meta">
          <span class="wl">${wl(t.wins, t.losses)}</span>
          ${t.games_back > 0 ? `<span class="dot">·</span><span>${t.games_back.toFixed(1)} GB</span>` : ''}
          <span class="dot">·</span>
          <span class="${t.point_diff > 0 ? 'pos' : t.point_diff < 0 ? 'neg' : ''}">${plusMinus(t.point_diff)}</span>
        </div>
        <div class="meta" style="margin-top:6px">${esc([t.player_1_name, t.player_2_name].filter(Boolean).join(' · ') || '—')}</div>
      </a>`).join('')}</div></div>`;
    render(shell(leagueHeader(league, 'teams') + body));
  });
}

async function viewTeam(slug, tid) {
  await withLeague(slug, async (league) => {
    render(shell(leagueHeader(league, 'teams') + `<div class="section"><div class="loading">Loading team…</div></div>`));
    let detail;
    try { detail = await api('team', { lid: league.league_id, tid }); }
    catch (e) { return render(shell(leagueHeader(league, 'teams') + `<div class="section"><div class="err">${esc(e.message)}</div></div>`)); }

    const t = detail.team, s = detail.standing;
    const teamHeader = `
      <div class="panel section-card">
        <div class="panel-h"><h3>Team Profile</h3>${s?.rank ? `<span class="pill">Rank #${s.rank}</span>` : ''}</div>
        <div style="padding: 20px 24px;">
          <div style="display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;">
            <h2 style="margin:0; font-size: 28px; font-weight: 900; letter-spacing: -0.025em;">${esc(t.team_name)}</h2>
            <div style="color: var(--text-muted); font-size: 14px;">${esc([t.player_1_name, t.player_2_name].filter(Boolean).join(' · ') || '—')}</div>
          </div>
          ${s ? `
            <div class="stat-block">
              <div><div class="stat-label">Record</div><div class="stat-val num">${wl(s.wins, s.losses)}</div></div>
              <div><div class="stat-label">Games Back</div><div class="stat-val num">${s.games_back > 0 ? s.games_back.toFixed(1) : '—'}</div></div>
              <div><div class="stat-label">Point Diff</div><div class="stat-val num ${s.point_diff > 0 ? 'pos' : s.point_diff < 0 ? 'neg' : ''}">${plusMinus(s.point_diff)}</div></div>
              <div><div class="stat-label">Pts For / Against</div><div class="stat-val num">${s.points_for} / ${s.points_against}</div></div>
            </div>` : ''}
        </div>
      </div>`;

    const byWeek = new Map();
    for (const m of detail.schedule || []) {
      if (!byWeek.has(m.week)) byWeek.set(m.week, []);
      byWeek.get(m.week).push(m);
    }
    const scheduleHtml = `
      <div class="panel section-card">
        <div class="panel-h"><h3>Schedule &amp; Results</h3><span class="pill">${detail.schedule?.length || 0} matches</span></div>
        ${!byWeek.size ? `<div style="padding:16px; color: var(--text-muted);">No matches scheduled.</div>` : [...byWeek.entries()].map(([week, matches]) => `
          <div class="week-header-row">Week ${week}${matches[0]?.play_date ? ' · ' + shortDate(matches[0].play_date) : ''}</div>
          <table>
            <thead><tr><th class="c">R</th><th class="c">Court</th><th>Opponent</th><th>Lineup (us / them)</th><th class="c">Result</th></tr></thead>
            <tbody>${matches.map(m => `
              <tr>
                <td class="c muted">${m.round}</td>
                <td class="c muted">${m.court ?? '—'}</td>
                <td><div class="team-cell"><a href="#/${esc(league.slug)}/teams/${esc(m.opponent_id)}">${esc(m.opponent_name)}</a></div></td>
                <td>
                  ${m.played ? `
                    <div class="team-sub"><strong style="color: var(--text);">${esc((m.my_players || []).join(' · ') || '—')}</strong></div>
                    <div class="team-sub">vs ${esc((m.opp_players || []).join(' · ') || '—')}</div>
                  ` : `<div class="team-sub muted">—</div>`}
                </td>
                <td class="c">
                  ${m.played ? `
                    <span class="pill-badge ${m.won ? 'win' : 'loss'}" style="margin-right:6px;">${m.won ? 'W' : 'L'}</span>
                    <span class="score ${m.won ? 'score-win' : 'score-loss'}">${m.my_score}–${m.opp_score}</span>
                  ` : `<span class="pill-badge scheduled">Scheduled</span>`}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`).join('')}
      </div>`;

    const h2hHtml = `
      <div class="panel section-card">
        <div class="panel-h"><h3>Head-to-Head</h3><span class="pill">vs every team</span></div>
        <table>
          <thead><tr><th>Opponent</th><th class="r">W–L</th><th class="r">Pts For</th><th class="r">Pts Against</th><th class="r">+/−</th><th class="r">Remaining</th></tr></thead>
          <tbody>${(detail.h2h || []).map(h => {
            const diff = h.points_for - h.points_against;
            return `<tr class="row-link" onclick="location.hash='#/${esc(league.slug)}/teams/${esc(h.opponent_id)}'">
              <td class="team-cell"><a href="#/${esc(league.slug)}/teams/${esc(h.opponent_id)}">${esc(h.opponent_name)}</a></td>
              <td class="r wl">${wl(h.wins, h.losses)}</td>
              <td class="r num">${h.points_for}</td>
              <td class="r num">${h.points_against}</td>
              <td class="r ${diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''}">${plusMinus(diff)}</td>
              <td class="r num">${h.remaining}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;

    const subsHtml = detail.subs?.length ? `
      <div class="panel section-card">
        <div class="panel-h"><h3>Substitution History</h3><span class="pill">${detail.subs.length} total</span></div>
        <table>
          <thead><tr><th class="c">Week</th><th>Date</th><th>Direction</th><th>Player Out</th><th>Sub In</th><th>Notes</th></tr></thead>
          <tbody>${detail.subs.map(s => `
            <tr>
              <td class="c muted">${s.week ?? '—'}</td>
              <td class="muted">${s.play_date ? shortDate(s.play_date) : '—'}</td>
              <td><span class="pill-badge ${s.direction === 'in' ? 'scheduled' : 'loss'}">${s.direction === 'in' ? 'Subbed FOR another team' : 'Sub for our team'}</span></td>
              <td>${esc(s.absent_name || '—')}</td>
              <td>${esc(s.substitute_name || '—')}</td>
              <td class="muted">${esc(s.notes || '')}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>` : '';

    render(shell(leagueHeader(league, 'teams') + `<div class="section">${teamHeader}${scheduleHtml}${h2hHtml}${subsHtml}</div>`));
  });
}

//-- ROUTER ---------------------------------------------------------------
function render(html) {
  document.getElementById('app').innerHTML = html;
  window.scrollTo({ top: 0 });
}

function route() {
  const hash = (location.hash || '#/').replace(/^#/, '');
  const parts = hash.split('/').filter(Boolean);
  // /, /:slug, /:slug/schedule, /:slug/results, /:slug/teams, /:slug/teams/:tid
  if (parts.length === 0) return viewLeagues();
  const [slug, sub, tid] = parts;
  if (sub === 'schedule') return viewSchedule(slug);
  if (sub === 'results')  return viewResults(slug);
  if (sub === 'teams' && tid) return viewTeam(slug, tid);
  if (sub === 'teams') return viewTeams(slug);
  return viewStandings(slug);
}

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>

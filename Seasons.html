<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title><?= appName ?> — Seasons</title>
  <?!= include_('Styles') ?>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
    h1 { margin: 14px 0 6px; font-size: 22px; }
    .sub { color: var(--text-muted); margin: 0 0 18px; font-size: 13px; }

    .season-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .season-header {
      padding: 10px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .season-header .count { color: var(--text-muted); font-weight: 500; font-size: 12px; }
    .league-row {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex; gap: 14px; align-items: center;
      transition: background 0.1s;
    }
    .league-row:last-child { border-bottom: none; }
    .league-row:hover { background: var(--brand-orange-soft); }
    .league-row .lg-name { font-weight: 700; flex: 1; }
    .league-row .lg-meta { color: var(--text-muted); font-size: 13px; }
    .format-pill {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 600; text-transform: lowercase;
    }
    .format-pill.ladder { background: var(--brand-orange-soft); color: var(--brand-orange-dark); }
    .format-pill.partner { background: var(--brand-green-soft); color: var(--brand-green-dark); }
    .err { color: var(--error); padding: 12px 0; }
  </style>
</head>
<body>
  <div class="app-header">
    <?!= include_('Logo') ?>
    <span class="who">Signed in as <code><?= user.email || 'anonymous' ?></code> · <?= user.roles.join(', ') || 'no roles' ?></span>
  </div>

  <?!= include_('Nav') ?>

  <h1>Seasons</h1>
  <p class="sub">Leagues grouped by season. Click a league to open its schedule.</p>

  <div id="content"><span class="muted">Loading…</span></div>

  <script>
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    let CACHED_APP_URL = null;
    function withAppUrl_(cb) {
      if (CACHED_APP_URL) { cb(CACHED_APP_URL); return; }
      var ref = document.referrer || '';
      var m = ref.match(/^(.+\/macros\/(?:s\/[^/]+|[^/]+)\/(?:dev|exec))/);
      if (m && m[1]) { CACHED_APP_URL = m[1]; cb(m[1]); return; }
      google.script.run.withSuccessHandler(u => { CACHED_APP_URL = u; cb(u); }).getAppUrl();
    }
    function openLeague(lid) {
      withAppUrl_(u => { window.top.location.href = u + '?page=league&lid=' + encodeURIComponent(lid) + '&tab=schedule'; });
    }

    function render(leagues) {
      const el = document.getElementById('content');
      const bySeason = new Map();
      leagues.forEach(l => {
        const key = (l.season_label || '').trim() || '(no season)';
        if (!bySeason.has(key)) bySeason.set(key, []);
        bySeason.get(key).push(l);
      });
      if (!bySeason.size) { el.innerHTML = '<p class="muted">No leagues yet.</p>'; return; }
      const seasonKeys = Array.from(bySeason.keys()).sort().reverse();
      el.innerHTML = seasonKeys.map(season => {
        const rows = bySeason.get(season).slice().sort((a,b) => (a.name||'').localeCompare(b.name||''));
        const leagueRows = rows.map(l => {
          const fmt = (l.format_type || '').toLowerCase();
          const meta = [l.level, l.day_of_week, l.start_time].filter(Boolean).join(' · ');
          return `<div class="league-row" data-lid="${escapeHtml(l.league_id)}">
            <span class="lg-name">${escapeHtml(l.name || '(unnamed)')}</span>
            <span class="lg-meta">${escapeHtml(meta)}</span>
            <span class="format-pill ${fmt}">${escapeHtml(fmt || '—')}</span>
          </div>`;
        }).join('');
        return `<div class="season-block">
          <div class="season-header"><span>${escapeHtml(season)}</span><span class="count">${rows.length} league${rows.length===1?'':'s'}</span></div>
          ${leagueRows}
        </div>`;
      }).join('');
      el.querySelectorAll('.league-row').forEach(r => {
        r.addEventListener('click', () => openLeague(r.getAttribute('data-lid')));
      });
    }

    google.script.run
      .withSuccessHandler(r => {
        if (!r || !r.ok) {
          document.getElementById('content').innerHTML =
            '<p class="err">' + escapeHtml((r && r.error) || 'Failed to load') + '</p>';
          return;
        }
        render(r.data || []);
      })
      .withFailureHandler(e => {
        document.getElementById('content').innerHTML =
          '<p class="err">' + escapeHtml(String(e && e.message || e)) + '</p>';
      })
      .api_listLeagues();
  </script>
</body>
</html>

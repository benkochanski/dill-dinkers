<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title><?= appName ?></title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin: 0 0 4px; }
    .sub { color: #666; margin: 0 0 24px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    a.btn { display: inline-block; padding: 8px 14px; background: #2c5; color: #fff; border-radius: 6px; text-decoration: none; }
    a.btn:hover { background: #1a4; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1><?= appName ?></h1>
  <p class="sub">Signed in as <code><?= user.email || 'anonymous' ?></code> — roles: <?= user.roles.join(', ') || 'none' ?></p>

  <div class="card">
    <strong>Admin</strong><br>
    Manage leagues, registrations, subs, email.<br>
    <a class="btn" href="?page=admin">Open admin</a>
  </div>

  <div class="card">
    <strong>Operator</strong><br>
    Run a league night: today view, scores entry, display.<br>
    <a class="btn" href="?page=operator">Open operator</a>
  </div>

  <div class="card">
    <strong>Display</strong><br>
    Big-screen scoreboard for venue TVs.<br>
    <a class="btn" href="?page=display">Open display</a>
  </div>

  <div class="card">
    <strong>Player</strong><br>
    Personal stats and schedule.<br>
    <a class="btn" href="?page=player">Open player</a>
  </div>
</body>
</html>

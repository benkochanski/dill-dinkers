<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — <?= appName ?></title>
  <?!= include_('Styles') ?>
  <style>
    body { margin: 0; padding: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
    .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 36px 32px; max-width: 380px; width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
    .login-card h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .login-card h1 .accent { color: var(--brand-orange); }
    .login-card p.sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
    .login-card input[type=password] { width: 100%; padding: 12px 14px; font-size: 15px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
    .login-card input[type=password]:focus { outline: none; border-color: var(--brand-orange); }
    .login-card .btn, .login-card button { display: block; width: 100%; padding: 12px; font-size: 15px; font-weight: 700; background: var(--brand-orange); color: #fff; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; box-sizing: border-box; transition: background 0.12s; }
    .login-card .btn:hover, .login-card button:hover:not(:disabled) { background: var(--brand-orange-dark); color: #fff; }
    .login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-card .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .login-card .msg.err { color: #c93030; }
    .login-card .msg.ok { color: #2a8a2a; }
    .login-card .success-state { margin-top: 4px; }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" onsubmit="return doLogin(event)">
    <h1>Dill<span class="accent">·</span>Dinkers Staff</h1>
    <p class="sub">Enter the staff password to continue.</p>
    <div id="formState">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <button id="submitBtn" type="submit">Sign in</button>
    </div>
    <div id="successState" class="success-state" style="display:none">
      <div class="msg ok">✓ Signed in</div>
      <a id="continueBtn" class="btn" href="#" target="_top" style="margin-top:8px">Continue</a>
    </div>
    <div id="msg" class="msg"></div>
  </form>
  <script>
    const RETURN_PAGE = <?!= JSON.stringify(returnPage) ?>;
    const RETURN_PARAMS = <?!= returnParams ?>;
    let APP_URL = '';

    // Derive the outer (top) GAS URL from referrer — HtmlService runs us in
    // a googleusercontent.com iframe, so relative URLs would target the
    // iframe origin instead of the user-facing /exec URL.
    (function () {
      var ref = document.referrer || '';
      var m = ref.match(/^(.+\/macros\/(?:s\/[^/]+|[^/]+)\/(?:dev|exec))/);
      if (m && m[1]) {
        APP_URL = m[1];
      }
    }());

    function buildReturnUrl(token) {
      const q = new URLSearchParams();
      q.set('page', RETURN_PAGE);
      q.set('t', token);
      Object.keys(RETURN_PARAMS).forEach(k => q.set(k, RETURN_PARAMS[k]));
      return (APP_URL || '') + '?' + q.toString();
    }

    function doLogin(ev) {
      ev.preventDefault();
      const pw = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      msg.textContent = 'Signing in…';
      msg.className = 'msg';

      function handleResult(r) {
        btn.disabled = false;
        if (!r.ok) {
          msg.textContent = r.error || 'Sign-in failed';
          msg.className = 'msg err';
          const pwEl = document.getElementById('password');
          pwEl.value = '';
          pwEl.focus();
          return;
        }
        const token = r.data.token;
        try { localStorage.setItem('dd_staff_token', token); } catch (e) {}

        function showContinue(url) {
          msg.textContent = '';
          document.getElementById('formState').style.display = 'none';
          document.getElementById('successState').style.display = 'block';
          const cont = document.getElementById('continueBtn');
          cont.href = url;
          cont.focus();
        }

        if (APP_URL) {
          showContinue(buildReturnUrl(token));
        } else {
          google.script.run
            .withSuccessHandler(url => {
              APP_URL = url;
              showContinue(buildReturnUrl(token));
            })
            .withFailureHandler(() => showContinue(buildReturnUrl(token)))
            .getAppUrl();
        }
      }

      google.script.run
        .withSuccessHandler(handleResult)
        .withFailureHandler(e => {
          btn.disabled = false;
          msg.textContent = String(e && e.message || e);
          msg.className = 'msg err';
        })
        .api_login(pw);
      return false;
    }
  </script>
</body>
</html>

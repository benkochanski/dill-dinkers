  <?!= include_('Styles') ?>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 16px 20px;
      background: var(--dark-bg);
      color: var(--dark-text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* #content fills the space between header and footer; .fit-wrap inside
       grows to that, so the session-grid no longer needs JS height sizing. */
    #content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* Title text matches the logo's font/weight/size so the logo and title
       read as one continuous sentence ("DILL·DINKERS Elite Coed Ladder"). */
    h1 {
      margin: 0; line-height: 1;
      /* h1 owns the master font-size; children use 1em so a JS fitHeader()
         pass can shrink the whole row in one shot to keep it on one line. */
      font-size: 36px;
      flex: 1; min-width: 0;
      display: flex; align-items: baseline; gap: 0.4em;
      flex-wrap: nowrap; white-space: nowrap; overflow: hidden;
    }
    h1 > * { flex-shrink: 0; }
    /* Single shared class used by BOTH the logo and the league title so
       they're guaranteed to render identically. Size comes from h1. */
    .hd-text {
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900; font-size: 1em; letter-spacing: -0.02em;
      line-height: 1;
    }
    h1 .title-meta {
      color: var(--dark-text-muted);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500; font-size: 1em; letter-spacing: 0;
    }
    h1 .title-meta::before { content: '· '; margin-right: 4px; color: var(--dark-text-muted); }
    h1 .title-meta:empty { display: none; }
    /* Half indicator is colored to stand out from the rest of the meta line. */
    h1 .title-meta.title-meta-accent { color: var(--brand-green); font-weight: 700; }
    h1 .title-meta.title-meta-accent::before { color: var(--dark-text-muted); }
    h2 { margin: 0 0 8px; font-size: 24px; color: var(--brand-orange); }
    h3 { margin: 0 0 8px; font-size: 18px; color: var(--brand-green); }
    .header {
      display: flex; justify-content: flex-start; align-items: baseline;
      flex-wrap: nowrap; gap: 14px;
      /* Right padding clears the fixed QR (96px + 14px gap + 14px right margin). */
      margin-bottom: 6px; padding: 10px 124px 6px 0;
      min-height: 56px;
    }
    .meta { color: var(--dark-text-muted); font-size: 14px; }
    .picker { color: #fff; font-size: 13px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .picker label { color: var(--dark-text-muted); display: inline-block; }
    .picker select { padding: 6px 10px; background: var(--dark-card); color: #fff; border: 1px solid var(--dark-border); border-radius: 6px; font-size: 14px; }
    .half-toggle { display: inline-flex; gap: 0; border: 1px solid var(--dark-border); border-radius: 6px; overflow: hidden; }
    .half-toggle button { padding: 6px 14px; background: var(--dark-card); color: #fff; border: 0; border-right: 1px solid var(--dark-border); cursor: pointer; font-size: 14px; font-weight: 500; }
    .half-toggle button:last-child { border-right: 0; }
    .half-toggle button.active { background: var(--brand-orange); color: #fff; }
    .half-toggle button:hover:not(.active) { background: var(--dark-bg); }
    .half-toggle button:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Display uses the REVERSE-variant logo designed for dark backgrounds
       (white wordmark, color paddle/ball). No backing pill needed. */
    .logo-img { height: 56px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid var(--dark-border); padding: 6px 10px; text-align: left; }
    th { background: var(--dark-card); color: var(--brand-orange); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    td { font-size: 16px; }
    tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .rank { width: 36px; font-weight: 700; color: var(--brand-orange); }
    .pf { color: var(--brand-green); font-weight: 600; }
    .pa { color: #f99; }
    .err { color: #f99; }
    .session-summary { font-size: 14px; margin: 4px 0 8px; }
    .footer { margin-top: 8px; color: var(--dark-text-muted); font-size: 11px; text-align: center; }
    /* QR is just the image — no card chrome, no padding around it. */
    .qr-corner {
      position: fixed; top: 14px; right: 14px; z-index: 100;
      padding: 0;
    }
    .qr-corner img { display: block; width: 96px; height: 96px; }
    /* URL printed in the header to the left of the QR. Larger and orange so
       it's a primary call-to-action above the orange separator line. */
    .header-url {
      margin-left: auto;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700; font-size: 26px; letter-spacing: 0.01em;
      color: var(--brand-orange);
      white-space: nowrap;
    }
    /* Logo and league title now share the same h1 so they render in an
       identical font context — no chance of drift between the two pieces. */
    .logo-link { cursor: pointer; user-select: none; }
    .logo-dot { color: var(--brand-orange); }
    .picker-drawer {
      position: fixed; top: 100px; left: 18px; z-index: 200;
      background: var(--dark-card); border: 1px solid var(--dark-border);
      border-radius: 12px; padding: 14px 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
      display: none;
      min-width: 320px; max-width: 420px;
    }
    .picker-drawer.open { display: block; }
    .picker-drawer .picker { display: flex; flex-direction: column; gap: 12px; }
    .picker-drawer .picker-title {
      font-size: 12px; font-weight: 700; color: var(--brand-orange);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .picker-drawer .league-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 70vh; overflow-y: auto;
    }
    .picker-drawer .league-item {
      display: block; width: 100%;
      padding: 10px 12px;
      background: var(--dark-bg);
      border: 1px solid var(--dark-border);
      border-radius: 6px;
      color: #fff; font-size: 14px; font-weight: 500;
      text-align: left; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .picker-drawer .league-item:hover {
      background: rgba(245, 130, 32, 0.15);
      border-color: var(--brand-orange);
    }
    .picker-drawer .league-item.active {
      background: var(--brand-orange);
      border-color: var(--brand-orange);
      color: #fff; font-weight: 700;
    }
    .picker-drawer .league-item .day-time {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--dark-text-muted); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 2px;
    }
    .picker-drawer .league-item.active .day-time { color: rgba(255,255,255,0.85); }
    .picker-drawer .muted { color: var(--dark-text-muted); font-size: 13px; padding: 8px; }
    /* Halftime mix preview — each new group's 4 players with where they
       came from. Inherits the group-card container-query font scaling. */
    .hmix-row {
      display: grid; grid-template-columns: 1.4em 1fr auto;
      gap: 0.5em; align-items: baseline;
      padding: 0.4em 0.2em;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 1em;
    }
    .hmix-row:first-of-type { border-top: none; }
    .hmix-arrow { font-weight: 800; text-align: center; font-size: 1.1em; }
    .hmix-arrow.up   { color: var(--brand-green); }
    .hmix-arrow.down { color: #d44; }
    .hmix-arrow.same { color: var(--dark-text-muted); }
    .hmix-name { color: #fff; font-weight: 700; font-size: 1.2em; }
    .hmix-from { color: var(--dark-text-muted); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.05em; }
    /* Session view — fills the available viewport via flex layout from
       body → #content → .fit-wrap → .session-grid. No JS height sizing. */
    .fit-wrap { width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column; }
    /* Side-by-side layout: groups on the left (~2/3), season standings on
       the right (~1/3). Becomes vertical stack on narrow screens. */
    .session-with-standings {
      display: flex; flex-direction: row;
      gap: 1vw; width: 100%;
      flex: 1; min-height: 0;
    }
    /* min-width: 0 on both flex children — without it, the CSS Grid and the
       wide standings rows refuse to shrink below their intrinsic content
       width and the 2:1 flex ratio gets ignored. */
    /* Ratio bumped from 2:1 → 1.6:1 so the panel has room for two
       side-by-side standings columns. */
    .session-with-standings > .session-grid { flex: 1.6 1 0; min-width: 0; }
    .standings-side-panel {
      flex: 1 1 0; min-width: 0;
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 14px;
      padding: 0.8em 1em;
      display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
      container-type: size;
    }
    .standings-side-panel-h {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 0 0 0.4em;
    }
    .standings-side-panel-h h3 {
      font-size: 14px; margin: 0; color: var(--brand-orange);
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800;
    }
    .standings-side-panel-h .meta {
      font-size: 11px; color: var(--dark-text-muted); font-weight: 600;
    }
    /* Two sections in the panel — today's + season — side by side, each
       wrapped in its own subtle card so they read as separate tables and
       the gray Pts (today's) doesn't visually run into the gray ranks
       (season). */
    /* Stacked vertically now: Today's on top, Season below, divider between.
       (Was a left/right row split.) */
    .standings-side-panel-body {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column; gap: 0.4em;
    }
    .standings-side-divider {
      flex: 0 0 auto; height: 2px;
      background: linear-gradient(90deg, transparent, var(--brand-orange), transparent);
      opacity: 0.7; margin: 0.1em 0.3em; border-radius: 2px;
    }
    .standings-side-section {
      display: flex; flex-direction: column;
      flex: 1 1 0; min-width: 0; min-height: 0;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--dark-border);
      border-radius: 6px;
      padding: 0.2em 0.3em;
    }
    /* Top-5 rows that never scroll. */
    .standings-side-static { flex: 0 0 auto; display: block; }
    /* Remaining rows live in a clipped viewport; JS translates the inner
       wrapper to auto-cycle them. */
    .standings-side-scroll {
      flex: 1 1 0; min-height: 0; overflow: hidden; position: relative;
    }
    .standings-side-scroll-inner {
      display: block;
      will-change: transform;
    }
    /* Subtle fade at the bottom edge of the scroll viewport so rows
       dissolve rather than hard-clip as they cycle out. */
    .standings-side-scroll::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 1.5em; pointer-events: none;
      background: linear-gradient(to bottom, transparent, var(--dark-card));
    }
    .standings-side-list {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      /* Tuned to roughly match the matchup .pair size in group cards on a
         16:9 TV. Final value after the "20% smaller" pass last session. */
      font-size: clamp(16px, 1.2vw, 67px);
      line-height: 1.25;
    }
    .standings-side-row {
      display: grid;
      gap: 0.7em; align-items: center;
      padding: 0.3em 0.4em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex: 1 1 0; min-height: 0;
    }
    /* Today's and season share the SAME grid template so the rank and name
       columns line up across the panel. Stat columns are sized in ch so
       they're just wide enough for the values (W=1 digit, Pts/Score=2-3),
       leaving the bulk of each section's width for the name column. */
    .standings-side-row.today,
    .standings-side-row.season {
      grid-template-columns: 1.4em minmax(0, 1fr) 2ch 3ch;
      gap: 0.3em;
    }
    .standings-side-row.season .sc { grid-column: 4; }

    /* Partner-format season standings panel — full table format with
       # · Team · W-L · Pct · GB · +/- columns. Team cell shows team name
       on top with players underneath in small muted text. */
    .standings-side-row.partner-full {
      grid-template-columns: 1.8em minmax(0, 1fr) 3em 3em 2.5em 3em;
      gap: 0.5em;
      flex: 1 1 0; min-height: 0;
      padding: 0.4em 0.4em;
      align-items: center;
    }
    .standings-side-row.partner-full .nm { line-height: 1.15; }
    .standings-side-row.partner-full .nm .team-nm { color: #fff; font-weight: 800; }
    .standings-side-row.partner-full .nm .team-sub {
      color: var(--dark-text-muted); font-weight: 500;
      font-size: 0.6em; letter-spacing: 0.02em; margin-top: 0.15em;
    }
    .standings-side-row.partner-full .wl,
    .standings-side-row.partner-full .pct,
    .standings-side-row.partner-full .gb {
      color: #fff; font-weight: 600;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .standings-side-row.partner-full .pd {
      font-weight: 800; font-variant-numeric: tabular-nums; text-align: right;
      color: var(--dark-text-muted);
    }
    .standings-side-row.partner-full .pd.pos { color: var(--brand-green); }
    .standings-side-row.partner-full .pd.neg { color: #ff6464; }
    /* Header row alignment for partner full layout. */
    .standings-side-row.head.partner-full .wl,
    .standings-side-row.head.partner-full .pct,
    .standings-side-row.head.partner-full .gb,
    .standings-side-row.head.partner-full .pd {
      color: var(--dark-text-muted); font-weight: 700;
    }
    .standings-side-row.head.partner-full .title { grid-column: 1 / 3; }
    .standings-side-row:nth-of-type(odd):not(.head) { background: rgba(255,255,255,0.02); }
    .standings-side-row.head {
      flex: 0 0 auto;
      color: var(--dark-text-muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0.4em 0.4em 0.5em;
      border-bottom: 2px solid var(--dark-border);
      background: transparent !important;
      /* Critical: keep the row's font-size at the list default so ch-based
         grid columns (5ch 7ch 5ch) resolve to the SAME pixel widths as the
         data rows. Header text is shrunk via cell-level font-size below. */
    }
    .standings-side-row.head > span { font-size: 0.55em; }
    /* Section title sits in the head row, spanning the rank + name columns. */
    .standings-side-row.head .title {
      grid-column: 1 / 3;
      color: var(--brand-orange);
      font-weight: 800; font-size: 0.75em;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .standings-side-row .rk {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.6em; height: 1.6em; padding: 0 0.3em;
      border-radius: 999px;
      color: var(--dark-text-muted); font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: rgba(255,255,255,0.04);
    }
    .standings-side-row.head .rk {
      display: inline; padding: 0; height: auto; background: transparent;
    }
    .standings-side-row.r1 .rk {
      background: linear-gradient(135deg, #ffd54a, #f7a000);
      color: #1a1a1a;
      box-shadow: 0 0 0 2px rgba(255,213,74,0.25);
    }
    .standings-side-row.r2 .rk,
    .standings-side-row.r3 .rk {
      background: rgba(245, 130, 32, 0.25);
      color: var(--brand-orange);
    }
    .standings-side-row.rNR .rk {
      background: transparent; color: var(--dark-text-muted); font-weight: 700;
    }
    .standings-side-row .nm {
      color: #fff; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .standings-side-row.r1 .nm, .standings-side-row.r2 .nm, .standings-side-row.r3 .nm {
      color: #fff; font-weight: 700;
    }
    .standings-side-row.rNR .nm,
    .standings-side-row.rNR .w,
    .standings-side-row.rNR .p,
    .standings-side-row.rNR .sc { color: var(--dark-text-muted); font-weight: 500; }
    .standings-side-row .w {
      color: var(--brand-green); font-weight: 700;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .standings-side-row .p {
      color: var(--dark-text-muted); font-weight: 600;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .standings-side-row .sc {
      color: var(--brand-green); font-weight: 800;
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .session-grid {
      display: grid;
      grid-template-columns: repeat(var(--cols, 3), 1fr);
      grid-auto-rows: 1fr;
      gap: 1vw;
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    .group-card {
      background: var(--dark-card); border: 1px solid var(--dark-border);
      border-radius: 14px; padding: 3% 4%;
      display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
      /* The card establishes a query container; font-size lives on the inner
         wrapper below — cqi/cqb only resolve correctly on DESCENDANTS of the
         container, never the container itself (they'd silently fall back to
         viewport units, which is what made everything render at 72px). */
      container-type: size;
    }
    .group-card-inner {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      /* Bumped from min(3cqi, 5cqb) — paired with a compact standings strip
         (was a table) so the matchup rows can absorb the freed vertical room.
         Player names also get an explicit 1.3em on .pair below so they
         dominate the card visually, since "who am I playing where" is the
         primary thing someone walking up to the wall needs. */
      font-size: clamp(14px, min(3.7cqi, 6cqb), 96px);
    }
    .group-card .group-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4em; }
    .group-card h3 { font-size: 1.5em; font-weight: 800; margin: 0; }
    /* Round label: "R1" stacked over "C5" (or "BYE"), left-aligned in its
       grid column so the matchup's first name aligns with R1. */
    .round-label {
      display: flex; flex-direction: column; align-items: flex-start;
      line-height: 1.1; text-transform: uppercase;
    }
    .round-label .round-num {
      font-size: 0.95em; color: var(--brand-orange); font-weight: 800;
      letter-spacing: 0.04em;
    }
    .round-label .court-num {
      font-size: 0.95em; color: var(--dark-text-muted); font-weight: 700;
      letter-spacing: 0.04em;
    }
    /* Each .round is a 2-column grid: the round/court label sits to the
       LEFT of the matchup so the first name of each pairing horizontally
       aligns with "Rx". No vertical dead space between rounds. */
    .group-card-inner .round {
      position: relative;
      display: grid; grid-template-columns: 2.4em 1fr;
      gap: 0.6em; align-items: center;
      flex: 1 1 0; min-height: 0;
      /* Always reserve 4px of left space — the .current accent bar fills it
         when active; otherwise it stays transparent. Keeps R#/C# labels in
         the same x-position whether or not the row is the current round. */
      padding: 0.15em 0 0 4px;
    }
    /* Bye rounds dim their CONTENT, but keep the wrapper at full opacity so
       a "current bye" can still show its green background tint clearly. */
    .group-card-inner .round.bye > * { opacity: 0.5; }
    /* Current round in each group card — applies to byes as well so a group
       sitting out the current round is still flagged. Subtle green tint
       (the orange is already used for round separators) plus a left accent
       bar. Auto-advances when that round's last score comes in. */
    .group-card-inner .round.current {
      background: rgba(141, 198, 63, 0.10);
      box-shadow: inset 3px 0 0 var(--brand-green);
    }
    .group-card-inner .round.current .round-num { color: #fff; }
    .group-card-inner .round.bye.current > * { opacity: 0.7; }
    /* Orange line above each round (the 4-round block is bracketed by
       the line above R1 and the line below R4 — the latter comes from
       .standings-mini's top border). */
    .round::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px; background: rgba(245, 130, 32, 0.45);
    }
    .matchup {
      display: grid; grid-template-columns: 1fr auto auto auto 1fr;
      gap: 0.5em; padding: 0; align-items: center;
      font-size: 1em; font-weight: 600; line-height: 1.15;
    }
    .matchup:first-of-type { border-top: none; }
    .matchup .vs { color: var(--dark-text-muted); font-size: 0.7em; padding: 0 4px; font-weight: 500; }
    .matchup .pair {
      color: #e6edf5;
      font-size: 1.3em; line-height: 1.15;
      font-weight: 600;
      /* Stack the two names. Each name is a <span class="ln"> so it can be
         independently ellipsised when the column is too narrow. */
      display: flex; flex-direction: column;
      min-width: 0; overflow: hidden;
    }
    .matchup .pair .ln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Three states per pair: default (game not played yet) is soft off-white;
       winner pops via brighter white + heavier weight; loser fades to muted.
       Avoids the previous green-on-green clash with the "Group N" titles. */
    .matchup .pair.lose { color: var(--dark-text-muted); font-weight: 500; }
    /* Even narrower cards (e.g. 5×2 or 6×2 layouts): drop the .pair size
       further so the names keep fitting without ellipsis on typical content. */
    @container (max-width: 360px) {
      .matchup .pair { font-size: 1.05em; }
      .standings-mini .strow .player { font-size: 1.05em; }
    }
    @container (max-width: 280px) {
      .matchup .pair { font-size: 0.92em; }
      .standings-mini .strow .player { font-size: 0.92em; }
    }
    /* Lean each pair toward the center score block — without these, the
       1fr columns left-align text and you get dead space on the outer edges. */
    .matchup .pair:first-of-type { text-align: right; }
    .matchup .pair:last-of-type  { text-align: left; }
    .matchup .pair.win { color: #fff; font-weight: 900; }
    .matchup .score { font-size: 1.25em; font-weight: 800; min-width: 2em; text-align: center; color: #fff; }
    .matchup .score.lose { color: var(--dark-text-muted); font-weight: 500; }
    .matchup .score.empty { color: #345; }
    /* Standings takes one round-row-worth of vertical space (flex: 1 1 0)
       and splits internally into two sub-rows — 1st/2nd on top, 3rd/4th
       below. With 4 rounds + 1 standings = 5 equidistant zones beneath
       the group header. The top border doubles as the line BELOW round 4. */
    .standings-mini {
      flex: 1 1 0; min-height: 0;
      display: flex; flex-direction: column;
      border-top: 1px solid rgba(245, 130, 32, 0.45);
      padding-top: 0.05em;
    }
    .standings-mini .strow {
      flex: 1 1 0; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.4em;
      align-items: center;
      padding: 0 0.1em;
    }
    .standings-mini .strow .player {
      display: flex; align-items: baseline; gap: 0.35em;
      /* Match the matchup .pair size so rounds and standings share one
         visual scale (5 equidistant zones with equally-weighted text). */
      font-size: 1.3em; font-weight: 600; color: #fff;
      overflow: hidden; white-space: nowrap;
    }
    .standings-mini .strow .player .rank { color: var(--brand-orange); font-weight: 800; }
    .standings-mini .strow .player .name { overflow: hidden; text-overflow: ellipsis; }
    .standings-mini .strow .player .record { color: var(--dark-text-muted); font-weight: 500; margin-left: auto; padding-left: 0.4em; }
    .session-summary { color: var(--dark-text-muted); font-size: 13px; margin: 0 0 12px; }
    /* Session info card — fills the empty slot in N=5 / N=7 grids with
       at-a-glance week / half / progress / time. Same container-query type
       scale as group cards so it looks like a peer. */
    .session-card {
      background: var(--dark-card); border: 1px solid var(--dark-border);
      border-radius: 14px; padding: 3% 4%;
      display: flex; flex-direction: column;
      min-height: 0; overflow: hidden;
      container-type: size;
    }
    .session-card-inner {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-size: clamp(14px, min(3cqi, 5cqb), 96px);
      text-align: center;
    }
    .session-card .session-card-meta { font-size: 0.55em; color: var(--dark-text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6em; }
    .session-card .session-card-headline { font-size: 1.6em; font-weight: 800; color: var(--brand-orange); margin-bottom: 0.3em; line-height: 1.05; }
    .session-card .session-card-progress { font-size: 0.95em; color: var(--dark-text); margin-bottom: 0.7em; font-weight: 600; }
    .session-card .session-card-clock { font-size: 1.4em; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; line-height: 1; }
    /* Partner-league team card — vertical stack of colored bands.
       Same container-query pattern as group cards so type scales per card. */
    .team-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      display: flex; flex-direction: column;
      min-height: 0;
      container-type: size;
      color: #1a1a1a;
    }
    .team-card-inner {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      /* Team cards have less vertical content than group cards so we can run
         the type bigger. Tuned for cards in the 790×820 (N=14, 5×3) range up
         to 1320×1230 (N=5, 3×2) — keeps the longest standings line on one
         line at the small end without overflow. */
      font-size: clamp(14px, min(4.5cqi, 5.5cqb), 96px);
    }
    .team-card-name {
      background: var(--brand-orange); color: white;
      padding: 0.5em 0.7em 0.2em;
      font-size: 1.5em; font-weight: 800; line-height: 1.05;
    }
    .team-card-players {
      background: var(--brand-orange); color: white;
      padding: 0 0.7em 0.5em;
      font-size: 0.9em; font-weight: 800; line-height: 1.15;
    }
    .team-card-standings {
      background: var(--brand-green); color: #1a1a1a;
      padding: 0.5em 0.7em;
      font-size: 0.75em; font-weight: 800; line-height: 1.25;
      letter-spacing: 0.01em;
    }
    .team-card-today {
      background: var(--brand-orange); color: white;
      padding: 0.45em 0.7em;
      font-size: 0.8em; font-weight: 800;
    }
    .team-card-results {
      background: white; color: #1a1a1a;
      padding: 0.5em 0.8em;
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      /* Was 0.8em — bumped because rows have flex:1 1 0 so they share the
         whole white area; bigger text actually fills the row height. */
      font-size: 1em; font-weight: 600; line-height: 1.15;
    }
    .team-card-results .result {
      display: flex; align-items: center; gap: 0.6em;
      /* Each result grows to share the available vertical space, so the
         schedule fills the white area of the card instead of clumping at top. */
      flex: 1 1 0; min-height: 0;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding: 0.1em 0;
    }
    .team-card-results .result:first-child { border-top: none; }
    .team-card-results .result-icon {
      /* Round label badge — "R1", "R2", etc. instead of a bullet. Colored
         by result: green for wins, red for losses, gray for bye/scheduled. */
      min-width: 2em; padding: 0.18em 0.4em;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 0.25em;
      font-size: 0.85em; font-weight: 800; color: white;
      background: #888;
      flex-shrink: 0; line-height: 1;
      letter-spacing: 0.02em;
    }
    .team-card-results .result-icon.win  { background: var(--brand-green); }
    .team-card-results .result-icon.loss { background: #d44; }
    .team-card-results .result.upcoming { color: #555; }
    .team-card-results .result.upcoming .result-icon { background: #b9b9b9; }
    @media (min-width: 1400px) { td { font-size: 18px; } h1 { font-size: 48px; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span id="logoBtn" class="hd-text logo-link" title="Click to switch leagues" onclick="togglePickerDrawer(event)">DILL<span class="logo-dot">·</span>DINKERS</span>
      <span id="title" class="hd-text">DISPLAY</span>
      <span id="titleDate" class="title-meta"></span>
      <span id="titleWeek" class="title-meta"></span>
      <span id="titleHalf" class="title-meta title-meta-accent"></span>
    </h1>
    <div class="header-url">leagues.dilldinkersct.com</div>
  </div>

  <div class="picker-drawer" id="pickerDrawer">
    <div class="picker">
      <div class="picker-title">Choose a league</div>
      <div class="league-list" id="leagueList"><div class="muted">Loading…</div></div>
      <span id="halfToggle" class="half-toggle" style="display:none">
        <button data-half="1" onclick="setHalf(1)">1st Half</button>
        <button data-half="2" onclick="setHalf(2)">2nd Half</button>
      </span>
    </div>
  </div>

  <div id="content"></div>
  <p id="error" class="err"></p>
  <span id="lastUpdate" style="display:none"></span>

  <div class="qr-corner">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=192x192&data=https%3A%2F%2Fleagues.dilldinkersct.com&bgcolor=1a2035&color=ffffff&margin=0" alt="QR code">
  </div>

  <!-- Firebase Realtime Database SDK — used for push-based live updates.
       Falls back to polling if firebaseUrl is empty (Script Property unset). -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script>
    const FIREBASE_DB_URL = <?!= JSON.stringify(firebaseUrl || '') ?>;
  </script>
  <script>
    // Strip day prefix ("Wed "), trailing parens ("(Levels 4-6)"), and
     // trailing "League" so titles match the public site's short names.
    function cleanLeagueName(name) {
      let n = String(name || '');
      n = n.replace(/\s*\([^)]*\)\s*$/, '');
      n = n.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\b\s*(?:AM|PM)?\s+/i, '');
      n = n.replace(/\s+League\s*$/i, '');
      return n.trim();
    }

    // "Joe Loparco" → "Joe L.", "Madonna" → "Madonna". Used in matchups.
    // A trailing "*" is the server-side sub marker (non-rostered player) —
    // keep it on the abbreviated form so "Paula Smith *" → "Paula S. *"
    // rather than the previous "Paula *." (which treated * as the surname).
    function firstLastInitial(fullName) {
      let s = String(fullName || '').trim();
      let subMark = '';
      if (s.endsWith(' *')) { subMark = ' *'; s = s.slice(0, -2).trim(); }
      const parts = s.split(/\s+/);
      if (parts.length < 2) return (parts[0] || '') + subMark;
      return parts[0] + ' ' + parts[parts.length - 1].charAt(0) + '.' + subMark;
    }

    function togglePickerDrawer(ev) {
      if (ev) { ev.preventDefault(); ev.stopPropagation(); }
      const drawer = document.getElementById('pickerDrawer');
      drawer.classList.toggle('open');
    }
    // Close drawer on outside click.
    document.addEventListener('click', function (e) {
      const drawer = document.getElementById('pickerDrawer');
      if (!drawer || !drawer.classList.contains('open')) return;
      const logo = document.getElementById('logoBtn');
      if (drawer.contains(e.target) || (logo && logo.contains(e.target))) return;
      drawer.classList.remove('open');
    });

    let LEAGUES = [], CURRENT_LEAGUE = null, CURRENT_WEEK = null, CURRENT_HALF = null;
    let _firebaseRef = null;   // active Firebase listener (one per league)
    let _firebaseInitialized = false;
    let CURRENT_COURTS = [];        // mirrored from Operator's published state
    // When Firebase is configured, the WebSocket push is the primary update
    // channel and these polls are just safety nets. When Firebase isn't
    // configured (FIREBASE_DB_URL empty), they fall back to the old fast
    // cadence so the Display still feels responsive.
    const VERSION_POLL_MS = 1500;   // tiny version-stamp poll — sub-second response
    const FALLBACK_POLL_MS = 60000; // safety full-refresh in case a version bump was missed
    let _refreshing = false;        // guard against concurrent fetches
    let LAST_LEAGUE_VERSION = -1;   // last seen value of api_getLeagueVersion(league_id)

    // Listen for score-saved / half-changed events from the Operator tab (same origin).
    try {
      const _scoreCh = new BroadcastChannel('dill_scores');
      _scoreCh.onmessage = function(e) {
        if (!CURRENT_LEAGUE) return;
        const d = e && e.data || {};
        if (d.league_id && d.league_id !== CURRENT_LEAGUE.league_id) return;
        // Operator sends `half` (and optionally `week`, `courts`) when the
        // active session changes. Honor it so Display switches views automatically.
        if (d.week) CURRENT_WEEK = Number(d.week);
        if (d.half) {
          CURRENT_HALF = Number(d.half);
          updateHalfToggle();
        }
        if (Array.isArray(d.courts) && d.courts.length) CURRENT_COURTS = d.courts;
        updateWeekDisplay();
        refreshContent();
        // Bump the local version so the next 1.5s poll doesn't redundantly
        // re-fire refreshContent on the same change.
        LAST_LEAGUE_VERSION = LAST_LEAGUE_VERSION + 1;
      };
    } catch(e) { /* BroadcastChannel not supported — fallback to poll */ }

    // ----- Firebase live subscription -----------------------------------
    // If FIREBASE_DB_URL is set (Script Property), open a WebSocket listener
    // for this league. Any server-side mutation that calls publishToFirebase_
    // fans out here in ~50-150ms — no polling needed. Polling stays as a
    // safety fallback at a slow cadence (see FALLBACK_POLL_MS).
    function ensureFirebaseInit_() {
      if (_firebaseInitialized) return true;
      if (!FIREBASE_DB_URL) return false;
      if (typeof firebase === 'undefined') return false;
      try {
        firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
        _firebaseInitialized = true;
        return true;
      } catch (e) {
        console.warn('firebase init failed', e);
        return false;
      }
    }

    function setLiveStatus_(state) {
      // state: 'off' (no Firebase) | 'connecting' | 'live' | 'error'
      const dot = document.getElementById('liveDot');
      const lbl = document.getElementById('liveStatus');
      if (!dot || !lbl) return;
      const colors = { off:'#666', connecting:'#d4a017', live:'#2ecc71', error:'#e74c3c' };
      const labels = { off:'polling', connecting:'connecting…', live:'live', error:'reconnecting…' };
      dot.style.background = colors[state] || '#666';
      lbl.textContent = labels[state] || state;
    }

    function subscribeFirebase_(league_id) {
      if (!FIREBASE_DB_URL) { setLiveStatus_('off'); return; }
      if (!ensureFirebaseInit_()) { setLiveStatus_('error'); return; }
      setLiveStatus_('connecting');
      // Detach any prior listener if we switched leagues.
      if (_firebaseRef) { try { _firebaseRef.off(); } catch(e) {} _firebaseRef = null; }
      // Watch the connection state — flips to true the moment the WebSocket is up.
      try {
        firebase.database().ref('.info/connected').on('value', s => {
          setLiveStatus_(s.val() ? 'live' : 'error');
        });
      } catch(e) {}
      _firebaseRef = firebase.database().ref('leagues/' + league_id);
      _firebaseRef.on('value', snap => {
        const data = snap.val() || {};
        applyFirebasePush_(data);
      }, err => { console.warn('firebase listener error', err); setLiveStatus_('error'); });
    }

    // Client-side cache of the last-rendered payloads. Firebase pushes are
    // partial (a save only publishes /session, a recompute only publishes
    // /standings), so we merge each push into this cache and re-render from
    // the merged state. Seeded from the initial bundle fetch.
    let LAST_SESSION = null;
    let LAST_STANDINGS = null;
    let LAST_DAY_STANDINGS = null;
    let LAST_PARTNER_WEEK = null;
    let LAST_COMMAND_TS = 0;
    try { LAST_COMMAND_TS = Number(sessionStorage.getItem('dd_display_cmd_ts') || 0); } catch (e) {}

    function applyFirebasePush_(data) {
      if (!CURRENT_LEAGUE) return;
      // Operator-issued display command (e.g. forced reload from the entry
      // station). Compare against last-seen ts so the initial subscription
      // snapshot doesn't trigger a reload loop.
      const cmd = data && data.command;
      if (cmd && cmd.kind === 'reload' && Number(cmd.ts) > LAST_COMMAND_TS) {
        const ts = Number(cmd.ts);
        try { sessionStorage.setItem('dd_display_cmd_ts', String(ts)); } catch (e) {}
        LAST_COMMAND_TS = ts;
        window.location.reload();
        return;
      }
      const s = data.state || {};
      // Mirror week / half / courts the same way the version poll does.
      if (s.week != null && Number(s.week) !== Number(CURRENT_WEEK)) {
        CURRENT_WEEK = Number(s.week);
        updateWeekDisplay();
      }
      let halfChanged = false;
      if (s.half != null && Number(s.half) !== Number(CURRENT_HALF)) {
        CURRENT_HALF = Number(s.half);
        updateHalfToggle();
        halfChanged = true;
      }
      if (Array.isArray(s.courts) && s.courts.length) {
        const same = CURRENT_COURTS.length === s.courts.length &&
          CURRENT_COURTS.every((c, i) => Number(c) === Number(s.courts[i]));
        if (!same) CURRENT_COURTS = s.courts.map(Number);
      }
      if (s.version != null) LAST_LEAGUE_VERSION = Number(s.version);

      // If the half flipped but this push didn't carry a fresh session/snapshot
      // payload, the cached LAST_SESSION is from the OLD half — render-from-cache
      // would show stale groups. Invalidate and force a server refresh so the
      // new half's session lands without waiting on the safety-net poll.
      const hasFreshLadderPayload =
        (data.session && data.session.session) ||
        (data.snapshot && data.snapshot.kind === 'ladder' && data.snapshot.session);
      if (halfChanged && isLadder() && !hasFreshLadderPayload) {
        LAST_SESSION = null;
        LAST_DAY_STANDINGS = null;
        refreshContent();
        return;
      }

      // Merge any pushed payloads into the local cache.
      if (data.session && data.session.cleared) {
        // Explicit "session was reset" signal — wipe the cache and force a
        // fresh fetch so the empty state renders.
        LAST_SESSION = null;
        LAST_DAY_STANDINGS = null;
        refreshContent();
        return;
      }
      if (data.session && data.session.session) LAST_SESSION = data.session.session;
      if (data.standings && data.standings.rows) LAST_STANDINGS = data.standings.rows;
      // Today's standings push: published by api_recomputeStandings after every
      // save. Without this the panel would only refresh on the 60s fallback poll.
      if (data.day_standings && data.day_standings.rows) LAST_DAY_STANDINGS = data.day_standings.rows;
      const snap = data.snapshot || null;
      if (snap && snap.kind === 'ladder') {
        if (snap.session) LAST_SESSION = snap.session;
        if (snap.standings) LAST_STANDINGS = snap.standings;
        if (snap.day_standings) LAST_DAY_STANDINGS = snap.day_standings;
      } else if (snap && snap.kind === 'partner') {
        if (snap.week_view) LAST_PARTNER_WEEK = snap.week_view;
        if (snap.standings) LAST_STANDINGS = snap.standings;
      }

      // Re-render from the merged state. Skip if we have nothing yet (still
      // waiting on the initial bundle fetch).
      if (isLadder() && LAST_SESSION) {
        onSession(
          { ok: true, data: LAST_SESSION },
          { ok: true, data: LAST_STANDINGS || [] },
          { ok: true, data: LAST_DAY_STANDINGS || [] }
        );
        document.getElementById('lastUpdate').textContent =
          new Date().toLocaleTimeString() + ' (live)';
      } else if (isPartner() && LAST_PARTNER_WEEK) {
        onPartnerWeek(
          { ok: true, data: LAST_PARTNER_WEEK },
          { ok: true, data: LAST_STANDINGS || [] }
        );
        document.getElementById('lastUpdate').textContent =
          new Date().toLocaleTimeString() + ' (live)';
      }
    }

    function showErr(e) { document.getElementById('error').textContent = String(e && e.message || e); }
    function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function isLadder() { return CURRENT_LEAGUE && CURRENT_LEAGUE.format_type === 'ladder'; }
    function halfLabel(n) { return Number(n) === 2 ? '2nd Half' : '1st Half'; }


    /** Display has no manual half toggle — it mirrors the Operator. The
     *  toggle stub is kept hidden so existing code that calls updateHalfToggle()
     *  doesn't break. */
    function updateHalfToggle() {
      const tog = document.getElementById('halfToggle');
      if (tog) tog.style.display = 'none';
    }

    /** Binary-search the largest font that lets the standings strip render
     *  on a single line within its parent's width. CSS can't measure text,
     *  so we do it here on every render. */
    function fitStrip(stripEl) {
      const parent = stripEl && stripEl.parentElement;
      if (!parent || parent.clientWidth === 0) return;
      const target = parent.clientWidth - 4;
      let lo = 6, hi = 32;
      // Quick check: at hi px, does it fit? If so, use hi.
      stripEl.style.fontSize = hi + 'px';
      if (stripEl.scrollWidth <= target) { return; }
      while (hi - lo > 0.5) {
        const mid = (lo + hi) / 2;
        stripEl.style.fontSize = mid + 'px';
        if (stripEl.scrollWidth > target) hi = mid;
        else lo = mid;
      }
      stripEl.style.fontSize = lo + 'px';
    }
    function fitAllStrips() {
      document.querySelectorAll('.standings-mini .strip').forEach(fitStrip);
    }

    /** Binary-search the largest h1 font-size that keeps the header on a
     *  single line. h1's children are em-relative, so shrinking the h1
     *  scales the logo + title + date + week + half together. */
    function fitHeader() {
      const h1 = document.querySelector('.header h1');
      if (!h1) return;
      const target = h1.clientWidth;
      if (target === 0) return;
      // Start at the design max (36px) and only shrink if it overflows.
      const MAX = 36, MIN = 12;
      h1.style.fontSize = MAX + 'px';
      if (h1.scrollWidth <= target) return;
      let lo = MIN, hi = MAX;
      while (hi - lo > 0.5) {
        const mid = (lo + hi) / 2;
        h1.style.fontSize = mid + 'px';
        if (h1.scrollWidth > target) hi = mid;
        else lo = mid;
      }
      h1.style.fontSize = lo + 'px';
    }

    /** Update the "WEEK N OF M · HALF X" header spans based on CURRENT_WEEK
     *  and CURRENT_HALF. Empty strings hide each span via the :empty rule. */
    function updateWeekDisplay() {
      const weekEl = document.getElementById('titleWeek');
      const halfEl = document.getElementById('titleHalf');
      if (weekEl) {
        weekEl.textContent = (CURRENT_WEEK && CURRENT_LEAGUE && CURRENT_LEAGUE.weeks_count)
          ? `WEEK ${CURRENT_WEEK} OF ${CURRENT_LEAGUE.weeks_count}` : '';
      }
      if (halfEl) {
        halfEl.textContent = (CURRENT_HALF && isLadder())
          ? halfLabel(CURRENT_HALF).toUpperCase() : '';
      }
      // Header text changed — re-fit so it still fits on one line.
      requestAnimationFrame(fitHeader);
    }

    function init() {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showErr('google.script.run unavailable.'); return;
      }
      google.script.run
        .withSuccessHandler(onLeagues).withFailureHandler(showErr)
        .api_listLeagues();
      // Cheap 3s poll: just the league's version stamp. Full refresh fires
      // only when it changes (i.e. an Operator saved a score, started Half 2,
      // etc). 60s fallback covers any edge case where a bump was missed.
      // When Firebase is active, fall back polls only fire as a safety net
      // (30s for version, 5min for full refresh). Without Firebase, keep the
      // existing fast cadence so the Display still feels responsive.
      const versionMs  = FIREBASE_DB_URL ? 30000 : VERSION_POLL_MS;
      const fallbackMs = FIREBASE_DB_URL ? 300000 : FALLBACK_POLL_MS;
      setInterval(checkLeagueVersion, versionMs);
      setInterval(refreshContent, fallbackMs);
    }

    function checkLeagueVersion() {
      if (!CURRENT_LEAGUE || _refreshing) return;
      google.script.run
        .withSuccessHandler(r => {
          if (!r || !r.ok) return;
          const s = r.data || {};
          const v = Number(s.version || 0);
          let changed = (v !== LAST_LEAGUE_VERSION);
          // Mirror the Operator's active week / half / courts.
          if (s.week != null && Number(s.week) !== Number(CURRENT_WEEK)) {
            CURRENT_WEEK = Number(s.week);
            changed = true;
          }
          if (s.half != null && Number(s.half) !== Number(CURRENT_HALF)) {
            CURRENT_HALF = Number(s.half);
            updateHalfToggle();
            changed = true;
          }
          if (Array.isArray(s.courts) && s.courts.length &&
              JSON.stringify(s.courts) !== JSON.stringify(CURRENT_COURTS)) {
            CURRENT_COURTS = s.courts.slice();
            changed = true;
          }
          if (changed) {
            LAST_LEAGUE_VERSION = v;
            refreshContent();
          }
        })
        .withFailureHandler(() => { /* swallow — fallback poll will catch up */ })
        .api_getLeagueState(CURRENT_LEAGUE.league_id);
    }

    function onLeagues(resp) {
      if (!resp.ok) return showErr(resp.error);
      LEAGUES = resp.data || [];
      renderLeagueList();
      const qs = new URLSearchParams(window.location.search);
      // Preference order:
      //   1. ?leagueId=... in the URL (explicit override)
      //   2. last-loaded league saved to localStorage on a prior session
      //   3. first league in the list
      // (2) is what makes refreshes "stick" to whatever league the user was
      // viewing, instead of always snapping back to the alphabetical top.
      let lastLoaded = '';
      try { lastLoaded = localStorage.getItem('dd_display_league') || ''; } catch (e) {}
      const lastIsValid = lastLoaded && LEAGUES.some(l => l.league_id === lastLoaded);
      const preselect = qs.get('leagueId') ||
                        (lastIsValid ? lastLoaded : '') ||
                        (LEAGUES[0] && LEAGUES[0].league_id);
      const overrideWeek = Number(qs.get('week')) || null;
      const overrideHalf = Number(qs.get('half')) || null;
      if (preselect) selectLeague(preselect, overrideWeek, overrideHalf, true);
    }

    function renderLeagueList() {
      const list = document.getElementById('leagueList');
      if (!list) return;
      if (!LEAGUES.length) {
        list.innerHTML = '<div class="muted">— no leagues —</div>';
        return;
      }
      list.innerHTML = LEAGUES.map(l => {
        const cls = (CURRENT_LEAGUE && CURRENT_LEAGUE.league_id === l.league_id) ? ' active' : '';
        const day = l.day_of_week || '';
        const time = l.start_time || '';
        const dt = [day, time].filter(Boolean).join(' · ');
        const dtHtml = dt ? `<span class="day-time">${escapeHtml(dt)}</span>` : '';
        return `<button class="league-item${cls}" data-id="${escapeHtml(l.league_id)}">` +
               `${dtHtml}${escapeHtml(cleanLeagueName(l.full_name || l.name))}` +
               `</button>`;
      }).join('');
      // Event delegation: safer than inline onclick with potentially-special
      // league_id chars. Single listener handles all rows.
      list.onclick = function (e) {
        const btn = e.target && e.target.closest && e.target.closest('.league-item');
        if (btn && btn.dataset && btn.dataset.id) selectLeague(btn.dataset.id);
      };
    }

    // Click handler for items in the picker drawer. `silent` skips closing
    // the drawer (used during the initial auto-select on page load).
    function selectLeague(league_id, overrideWeek, overrideHalf, silent) {
      loadLeague(league_id, overrideWeek, overrideHalf);
      if (!silent) document.getElementById('pickerDrawer').classList.remove('open');
      // Refresh the highlighted item (CURRENT_LEAGUE is set inside loadLeague
      // after the server roundtrip, so re-render after a short tick).
      setTimeout(renderLeagueList, 100);
    }

    function loadLeague(league_id, overrideWeek, overrideHalf) {
      if (!league_id) return;
      google.script.run
        .withSuccessHandler(r => {
          if (!r.ok) return showErr(r.error);
          CURRENT_LEAGUE = r.data.league;
          // Stash the schedule's week count so the header can show "Week N of M".
          CURRENT_LEAGUE.weeks_count = (r.data.schedule || []).length || 0;
          // Reset the live-push cache for the new league and subscribe.
          LAST_SESSION = null; LAST_STANDINGS = null;
          LAST_DAY_STANDINGS = null; LAST_PARTNER_WEEK = null;
          subscribeFirebase_(CURRENT_LEAGUE.league_id);
          // Persist so a refresh stays on the same league.
          try { localStorage.setItem('dd_display_league', CURRENT_LEAGUE.league_id); } catch (e) {}
          document.getElementById('title').textContent =
            cleanLeagueName(CURRENT_LEAGUE.full_name || CURRENT_LEAGUE.name).toUpperCase();
          document.getElementById('titleDate').textContent =
            new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
          updateWeekDisplay();
          requestAnimationFrame(fitHeader);

          if (isLadder()) {
            if (overrideWeek) {
              CURRENT_WEEK = overrideWeek;
              CURRENT_HALF = overrideHalf || 1;
              updateHalfToggle();
              refreshContent();
              return;
            }
            // Mirror whatever the Operator is on. If no Operator state has
            // been published yet, fall back to the heuristic.
            google.script.run
              .withSuccessHandler(rState => {
                const s = (rState && rState.ok && rState.data) || {};
                if (s.week && s.half) {
                  CURRENT_WEEK = Number(s.week);
                  CURRENT_HALF = Number(s.half);
                  CURRENT_COURTS = Array.isArray(s.courts) ? s.courts.slice() : [];
                  LAST_LEAGUE_VERSION = Number(s.version || 0);
                  updateHalfToggle();
                  refreshContent();
                  return;
                }
                // No published state yet — heuristic fallback.
                google.script.run
                  .withSuccessHandler(r2 => {
                    if (r2.ok && r2.data && r2.data.week) {
                      CURRENT_WEEK = r2.data.week;
                      CURRENT_HALF = r2.data.half || 1;
                    } else {
                      CURRENT_WEEK = null;
                      CURRENT_HALF = null;
                    }
                    updateHalfToggle();
                    refreshContent();
                  })
                  .withFailureHandler(showErr)
                  .api_findLastSessionWeekHalf(CURRENT_LEAGUE.league_id);
              })
              .withFailureHandler(showErr)
              .api_getLeagueState(CURRENT_LEAGUE.league_id);
          } else if (isPartner()) {
            // Partner: prefer Operator-published state, then today's date in
            // League_Schedule, then nearest scheduled date.
            const schedule = (r.data.schedule || []).slice();
            google.script.run
              .withSuccessHandler(rState => {
                const s = (rState && rState.ok && rState.data) || {};
                CURRENT_HALF = null;
                CURRENT_COURTS = Array.isArray(s.courts) ? s.courts.slice() : [];
                LAST_LEAGUE_VERSION = Number(s.version || 0);
                if (s.week) {
                  CURRENT_WEEK = Number(s.week);
                } else {
                  CURRENT_WEEK = pickPartnerWeekForToday(schedule);
                }
                updateHalfToggle();
                refreshContent();
              })
              .withFailureHandler(() => {
                CURRENT_WEEK = pickPartnerWeekForToday(schedule);
                CURRENT_HALF = null;
                refreshContent();
              })
              .api_getLeagueState(CURRENT_LEAGUE.league_id);
          } else {
            CURRENT_WEEK = null;
            CURRENT_HALF = null;
            updateHalfToggle();
            refreshContent();
          }
        })
        .withFailureHandler(showErr)
        .api_getLeague(league_id);
    }

    /** Pick a partner-league week_number based on today's date.
     *  Exact match first; otherwise the nearest play_date by absolute distance. */
    function pickPartnerWeekForToday(schedule) {
      if (!schedule || !schedule.length) return null;
      const now = new Date();
      const today = now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0');
      const exact = schedule.find(s => String(s.play_date || '').slice(0, 10) === today);
      if (exact) return Number(exact.week_number);
      const todayMs = new Date(today + 'T12:00:00').getTime();
      let best = null, bestDiff = Infinity;
      schedule.forEach(s => {
        const d = String(s.play_date || '').slice(0, 10);
        if (!d) return;
        const ms = new Date(d + 'T12:00:00').getTime();
        if (isNaN(ms)) return;
        const diff = Math.abs(ms - todayMs);
        if (diff < bestDiff) { bestDiff = diff; best = s; }
      });
      return best ? Number(best.week_number) : null;
    }

    function refreshContent() {
      if (!CURRENT_LEAGUE) return;
      if (_refreshing) return;   // don't pile up concurrent fetches
      _refreshing = true;
      updateWeekDisplay();
      const done = () => { _refreshing = false; };
      if (isLadder() && CURRENT_WEEK && CURRENT_HALF) {
        const courtsArg = (CURRENT_COURTS && CURRENT_COURTS.length) ? CURRENT_COURTS : 0;
        // One bundled call: session + season standings + day standings.
        // Shares the request-scoped sheet cache so the 7+ sheets each computation
        // needs are deserialized once, not 3x in parallel V8 contexts.
        google.script.run
          .withSuccessHandler(r => {
            done();
            if (!r.ok) return showErr(r.error);
            const d = r.data || {};
            onSession(
              { ok: true, data: d.session },
              { ok: true, data: d.standings || [] },
              { ok: true, data: d.day_standings || [] }
            );
          })
          .withFailureHandler(e => { done(); showErr(e); })
          .api_getDisplayBundleLadder(CURRENT_LEAGUE.league_id, CURRENT_WEEK, CURRENT_HALF, courtsArg);
      } else if (isPartner() && CURRENT_WEEK) {
        // Bundled: per-team week view + season standings in one execution.
        google.script.run
          .withSuccessHandler(r => {
            done();
            if (!r.ok) return showErr(r.error);
            const d = r.data || {};
            onPartnerWeek(
              { ok: true, data: d.week_view },
              { ok: true, data: d.standings || [] }
            );
          })
          .withFailureHandler(e => { done(); showErr(e); })
          .api_getDisplayBundlePartner(CURRENT_LEAGUE.league_id, CURRENT_WEEK);
      } else {
        google.script.run
          .withSuccessHandler(r => { done(); onStandings(r); })
          .withFailureHandler(e  => { done(); showErr(e); })
          .api_recomputeStandings(CURRENT_LEAGUE.league_id);
      }
    }

    function isPartner() { return CURRENT_LEAGUE && CURRENT_LEAGUE.format_type === 'partner'; }

    /** Map api_getPartnerWeekView's per-team rounds into the shape
     *  renderTeamCard expects (today_record / today_results / today_upcoming),
     *  then hand off to renderPartner. */
    function onPartnerWeek(resp, standingsResp) {
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      if (!resp.ok) return showErr(resp.error);
      const data = resp.data || {};
      const seasonStandings = (standingsResp && standingsResp.ok) ? (standingsResp.data || []) : [];
      LAST_PARTNER_WEEK = data;
      if (standingsResp && standingsResp.ok) LAST_STANDINGS = standingsResp.data || [];
      const teams = data.teams || [];
      if (!teams.length) {
        document.getElementById('content').innerHTML =
          `<p class="meta">Week ${data.week_number || ''} — no teams yet.</p>`;
        return;
      }
      const rows = teams.map(t => {
        // Preserve the team's round sequence (1..R) verbatim — including bye
        // in its actual slot. Splitting into played/upcoming buckets used to
        // float the bye to the bottom, which made each team's schedule look
        // like it was changing as games were played.
        const today_rounds = (t.rounds || []).map(r => {
          if (r.kind === 'bye')       return { round: r.round, kind: 'bye' };
          if (r.kind === 'scheduled') return {
            round: r.round, kind: 'scheduled',
            court: r.court,
            opponent: r.opponent_name,
            opponent_rank: r.opponent_rank,
          };
          /* played */                return {
            round: r.round, kind: 'played',
            won: !!r.won,
            opponent: r.opponent_name,
            opponent_rank: r.opponent_rank,
            our_score: r.my_score,
            their_score: r.opp_score,
          };
        });
        const wkW = (t.week && t.week.wins)   || 0;
        const wkL = (t.week && t.week.losses) || 0;
        return {
          team_id:        t.team_id,
          team_name:      t.team_name,
          player_1_name:  t.player_1_name,
          player_2_name:  t.player_2_name,
          rank:           (t.season && t.season.rank)        || null,
          wins:           (t.season && t.season.wins)        || 0,
          losses:         (t.season && t.season.losses)      || 0,
          games_back:     (t.season && t.season.games_back)  || 0,
          point_diff:     (t.season && t.season.point_diff)  || 0,
          today_record:   `${wkW} - ${wkL}`,
          today_rounds:   today_rounds,
        };
      });
      document.getElementById('content').innerHTML = renderPartner(rows, seasonStandings);
      requestAnimationFrame(fitToViewport);
    }

    function onSession(resp, standingsResp, dayResp) {
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      if (!resp.ok) return showErr(resp.error);
      const session = resp.data;
      // Seed the live-push cache so subsequent partial pushes can re-render
      // without round-tripping for missing fields.
      LAST_SESSION = session;
      if (standingsResp && standingsResp.ok) LAST_STANDINGS = standingsResp.data || [];
      if (dayResp && dayResp.ok) LAST_DAY_STANDINGS = dayResp.data || [];
      const c = document.getElementById('content');
      if (!session || !session.exists) {
        // No session for this (week, half) yet. For Half 2 we can preview the
        // halftime mix — show it on the Display until the Operator confirms
        // and the new half is set up.
        if (Number(CURRENT_HALF) === 2) {
          c.innerHTML =
            `<p class="session-summary">Week ${CURRENT_WEEK} · Halftime mix — waiting for Operator to confirm 2nd Half…</p>`;
          google.script.run
            .withSuccessHandler(r => {
              if (!r.ok || !r.data) return;
              c.innerHTML = renderHalftimeMix(r.data);
              requestAnimationFrame(fitToViewport);
            })
            .withFailureHandler(() => {})
            .api_computeHalftimeMix(CURRENT_LEAGUE.league_id, CURRENT_WEEK);
          return;
        }
        c.innerHTML =
          `<p class="session-summary">Week ${CURRENT_WEEK} · Half ${CURRENT_HALF} — not set up yet.</p>`;
        return;
      }
      const seasonStandings = (standingsResp && standingsResp.ok) ? (standingsResp.data || []) : [];
      const dayStandings = (dayResp && dayResp.ok) ? (dayResp.data || []) : [];
      c.innerHTML = renderSession(session, seasonStandings, dayStandings);
      // Wait one paint, then run the per-render sizing passes.
      requestAnimationFrame(fitToViewport);
    }

    function renderHalftimeMix(mix) {
      const groups = mix.groups || [];
      const N = groups.length || 1;
      const gridWidth = (window.innerWidth || 1920);
      const best = pickGridLayout(N, gridWidth, (window.innerHeight || 1080));
      const cards = groups.map(g => {
        const rows = (g.players || []).map(p => {
          const fromTxt = `from G${p.from_group} · #${p.from_rank}`;
          const arrow = p.from_group > g.group_number
            ? '<span class="hmix-arrow up">▲</span>'
            : p.from_group < g.group_number
              ? '<span class="hmix-arrow down">▼</span>'
              : '<span class="hmix-arrow same">→</span>';
          return `<div class="hmix-row">
            ${arrow}
            <div class="hmix-name">${escapeHtml(p.full_name || '')}</div>
            <div class="hmix-from">${fromTxt}</div>
          </div>`;
        }).join('');
        return `<div class="group-card"><div class="group-card-inner">
          <div class="group-header"><h3>Group ${g.group_number}</h3></div>
          ${rows}
        </div></div>`;
      }).join('');
      return `<p class="session-summary">Week ${mix.week_number} · Halftime mix — waiting for Operator to confirm 2nd Half</p>` +
             `<div class="fit-wrap"><div class="session-grid" style="--cols:${best.cols}">${cards}</div></div>`;
    }

    /**
     * Now a no-op. CSS flex layout (body → #content → .fit-wrap → .session-grid)
     * handles viewport filling automatically. Kept for any existing callers
     * (e.g. requestAnimationFrame in onSession / onStandings).
     */
    function fitToViewport() {
      // Defer one more frame so container-query font sizing has settled and
      // scrollHeight/clientHeight are final before measuring overflow.
      requestAnimationFrame(initStandingsAutoScroll);
    }

    // Re-fit on window resize (TV picture changes, browser zoom, etc).
    window.addEventListener('resize', () => {
      requestAnimationFrame(() => {
        fitToViewport();
        fitHeader();
      });
    });

    function renderSession(s, seasonStandings, dayStandings) {
      // Index schedule cells by (group_number, round_number) so each group
      // can be rendered as a 4-round list (3 games + 1 bye).
      const cellByGroupRound = {};
      const totalRounds = (s.schedule || []).length || 4;
      (s.schedule || []).forEach(round => round.forEach(cell => {
        cellByGroupRound[cell.group_number + ':' + cell.round_number] = cell;
      }));
      // Session-wide current round = lowest round number where any group's
      // scheduled game is still incomplete. All groups (including those on
      // a bye in that round) will highlight the same round as "current".
      const gameByKey = {};
      s.groups.forEach(grp => {
        (grp.rotation || []).forEach(g => {
          if (g.game) gameByKey[grp.group_number + ':' + g.game_in_match] = g.game;
        });
      });
      let sessionCurrentRound = null;
      for (let r = 1; r <= totalRounds; r++) {
        const cells = (s.schedule && s.schedule[r - 1]) || [];
        let done = cells.length > 0;
        for (const cell of cells) {
          const game = gameByKey[cell.group_number + ':' + cell.game_in_match];
          if (!game || game.status !== 'complete') { done = false; break; }
        }
        if (!done) { sessionCurrentRound = r; break; }
      }
      renderGroupCard._currentRound = sessionCurrentRound;
      const cards = s.groups.map(grp => renderGroupCard(grp, cellByGroupRound, totalRounds)).join('');
      // Pick the grid shape (cols × rows) that best fits the available width
      // for N cards. The standings panel on the right takes ~26vw, so the
      // grid lives in the remaining ~73vw — pass that down so cards aren't
      // built for a 16:9 viewport they no longer have.
      const N = s.groups.length || 1;
      // Grid + panel share viewport at a 1.6:1 ratio (see .session-with-
       // standings CSS). Pass the grid's slice so cards pick a cols×rows
       // shape matching the area they actually occupy.
      const gridWidth = Math.max(1, (window.innerWidth || 1920) * (1.6 / 2.6));
      const best = pickGridLayout(N, gridWidth, (window.innerHeight || 1080));
      const sessionCard = renderSessionInfoCard(s, best, N);
      const standings = seasonStandings || [];
      const grid = `<div class="session-grid" style="--cols:${best.cols}">${cards}${sessionCard}</div>`;
      const body = standings.length
        ? `<div class="session-with-standings">${grid}${renderStandingsSidePanel(standings, s, dayStandings)}</div>`
        : grid;
      return `<div class="fit-wrap">${body}</div>`;
    }

    function renderStandingsSidePanel(standings, session, dayStandings) {
      const rankCls = r => r === 1 ? ' r1' : r === 2 ? ' r2' : r === 3 ? ' r3' : (r == null ? ' rNR' : '');

      // ---- Today's standings come from api_getDayStandings which aggregates
      // every complete game for this week (BOTH halves). That way the panel
      // doesn't reset when halftime advances and players keep accumulating
      // wins/points across the day.
      // Fall back to per-half session aggregation only if the daily endpoint
      // returned nothing (e.g. before games start, or partner format).
      let todays = (dayStandings || []).map(p => ({
        player_id: p.player_id,
        full_name: p.full_name,
        wins: p.wins || 0,
        points: p.points_for || 0,
        gp: p.games_played || 0,
        rank: p.rank,
      }));
      if (!todays.length) {
        ((session && session.groups) || []).forEach(grp => {
          (grp.standings || []).forEach(p => {
            todays.push({
              player_id: p.player_id,
              full_name: p.full_name,
              wins: p.wins || 0,
              points: p.points_for || 0,
              gp: p.games_played || 0,
            });
          });
        });
        todays.sort((a, b) => {
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (b.points !== a.points) return b.points - a.points;
          return String(a.full_name).localeCompare(b.full_name);
        });
        todays.forEach((p, i) => { p.rank = i + 1; });
      }

      // Number of top places that stay pinned (never scroll) in each list.
      const STATIC_COUNT = 5;

      // Wrap a list of row-HTML strings into a static top-N block + a
      // scrolling remainder block. The scroll block is auto-cycled by
      // initStandingsAutoScroll() after the panel is in the DOM.
      const splitRows = rowHtmls => {
        const staticRows = rowHtmls.slice(0, STATIC_COUNT).join('');
        const scrollRows = rowHtmls.slice(STATIC_COUNT).join('');
        const scrollBlock = scrollRows
          ? `<div class="standings-side-scroll">
               <div class="standings-side-scroll-inner">${scrollRows}</div>
             </div>`
          : '';
        return `<div class="standings-side-static">${staticRows}</div>${scrollBlock}`;
      };

      const todayHead = `<div class="standings-side-row head today">
        <span class="title">Today's Standings</span>
        <span class="w">W</span>
        <span class="p">Pts</span>
      </div>`;
      const todayRowHtmls = todays.map(p => `<div class="standings-side-row today${rankCls(p.rank)}">
        <span class="rk">${p.rank}</span>
        <span class="nm">${escapeHtml(p.full_name || '')}</span>
        <span class="w">${p.wins}</span>
        <span class="p">${p.points}</span>
      </div>`);

      const todaySection = todays.length
        ? `<div class="standings-side-section today">
            <div class="standings-side-list">${todayHead}${splitRows(todayRowHtmls)}</div>
          </div>`
        : '';

      // ---- Season standings: rank · name · score
      const seasonHead = `<div class="standings-side-row head season">
        <span class="title">Season Standings</span>
        <span class="sc">Score</span>
      </div>`;
      const seasonRowHtmls = (standings || []).map(s => {
        const gp = s.games_played || 0;
        const scStr = gp > 0 ? (s.score || 0).toFixed(1) : '—';
        const rkStr = s.rank == null ? '—' : s.rank;
        return `<div class="standings-side-row season${rankCls(s.rank)}">
          <span class="rk">${rkStr}</span>
          <span class="nm">${escapeHtml(s.full_name || '')}</span>
          <span class="sc">${scStr}</span>
        </div>`;
      });

      const seasonSection = `<div class="standings-side-section season">
        <div class="standings-side-list">${seasonHead}${splitRows(seasonRowHtmls)}</div>
      </div>`;

      const divider = todaySection ? `<div class="standings-side-divider"></div>` : '';

      return `<div class="standings-side-panel">
        <div class="standings-side-panel-body">
          ${todaySection}
          ${divider}
          ${seasonSection}
        </div>
      </div>`;
    }

    /**
     * Auto-cycle every `.standings-side-scroll` viewport whose content
     * overflows. Pins are handled in CSS (the static block sits above the
     * scroll viewport); this just gently scrolls the remainder: ease down to
     * the bottom, hold, ease back to the top, hold, repeat.
     *
     * A generation token invalidates loops from prior renders — innerHTML
     * replacement detaches the old nodes, but their rAF callbacks would keep
     * firing otherwise.
     */
    let _scrollGen = 0;
    function initStandingsAutoScroll() {
      const gen = ++_scrollGen;
      const PX_PER_SEC = 24;      // scroll speed
      const HOLD_MS = 2500;       // pause at top and bottom
      document.querySelectorAll('.standings-side-scroll').forEach(viewport => {
        const inner = viewport.querySelector('.standings-side-scroll-inner');
        if (!inner) return;
        const overflow = inner.scrollHeight - viewport.clientHeight;
        if (overflow <= 2) { inner.style.transform = 'translateY(0)'; return; }

        // Phases: 'holdTop' → 'down' → 'holdBottom' → 'up' → loop.
        let phase = 'holdTop';
        let phaseStart = null;
        const step = ts => {
          if (gen !== _scrollGen || !document.contains(viewport)) return; // stale
          if (phaseStart == null) phaseStart = ts;
          const elapsed = ts - phaseStart;
          let y = 0;
          if (phase === 'holdTop') {
            y = 0;
            if (elapsed >= HOLD_MS) { phase = 'down'; phaseStart = ts; }
          } else if (phase === 'down') {
            y = Math.min(overflow, (elapsed / 1000) * PX_PER_SEC);
            if (y >= overflow) { y = overflow; phase = 'holdBottom'; phaseStart = ts; }
          } else if (phase === 'holdBottom') {
            y = overflow;
            if (elapsed >= HOLD_MS) { phase = 'up'; phaseStart = ts; }
          } else if (phase === 'up') {
            y = Math.max(0, overflow - (elapsed / 1000) * PX_PER_SEC);
            if (y <= 0) { y = 0; phase = 'holdTop'; phaseStart = ts; }
          }
          inner.style.transform = 'translateY(' + (-y) + 'px)';
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    /**
     * Pick (cols, rows) for an N-card grid on the current viewport. Empty cells
     * are cheap (we can drop a session-info card in one); aspect distortion is
     * EXPENSIVE — using a multiplicative ratio penalty (squared) means cards
     * like N=13 prefer 5×3 with two empty cells over a 13×1 row of slivers.
     * Verified for N=1..16; matches intuition at every count.
     */
    function pickGridLayout(N, widthOverride, heightOverride) {
      const w = widthOverride || (window.innerWidth || 1920);
      const h = heightOverride || (window.innerHeight || 1080);
      const targetAspect = w / h;
      let best = { cols: 1, rows: N, score: Infinity };
      for (let cols = 1; cols <= N; cols++) {
        const rows = Math.ceil(N / cols);
        const empty = cols * rows - N;
        const cellAspect = (1 / cols) / (1 / rows) * targetAspect;
        // Target a slightly portrait card aspect (~0.9). The card holds 4
        // stacked rounds + a standings table, which is intrinsically taller
        // than wide — picking landscape cards (the old 1.4 target) cut off
        // round 4 at counts like N=6 (forced 2×3 = wide cards). 0.9 makes
        // N=6 pick 3×2 (taller cards) and the content fits.
        const ratio = cellAspect / 0.9;
        const aspectPenalty = (ratio < 1 ? 1/ratio : ratio) - 1;
        const score = empty * 50 + aspectPenalty * aspectPenalty * 100;
        if (score < best.score) best = { cols, rows, score };
      }
      return best;
    }

    function renderGroupCard(grp, cellByGroupRound, totalRounds) {
      const rotationByGame = {};
      (grp.rotation || []).forEach(g => { rotationByGame[g.game_in_match] = g; });

      // Each round is wrapped in a `.round` 2-col grid: round/court label
      // on the left, matchup on the right. The 4 rounds use flex:1 so they
      // split the card's vertical space evenly.
      const labelHtml = (r, courtTxt) =>
        `<div class="round-label"><span class="round-num">R${r}</span>` +
        (courtTxt ? `<span class="court-num">${courtTxt}</span>` : '') +
        `</div>`;
      // Current round comes from the session level so byes get highlighted
      // too — when this group is sitting out the current round, that bye
      // row should still indicate "now". Falls back to a per-group scan if
      // the parent didn't pass one in.
      let currentRound = renderGroupCard._currentRound || null;
      if (currentRound == null) {
        for (let r = 1; r <= totalRounds; r++) {
          const cell = cellByGroupRound[grp.group_number + ':' + r];
          if (!cell) continue;
          const game = cell.game;
          if (!game || game.status !== 'complete') { currentRound = r; break; }
        }
      }
      const rounds = [];
      for (let r = 1; r <= totalRounds; r++) {
        const isCurrent = r === currentRound;
        const cell = cellByGroupRound[grp.group_number + ':' + r];
        if (!cell) {
          rounds.push(`<div class="round bye${isCurrent ? ' current' : ''}">
            ${labelHtml(r, 'BYE')}
            <div class="matchup">
              <span class="pair">—</span>
              <span class="score empty">—</span>
              <span class="vs">bye</span>
              <span class="score empty">—</span>
              <span class="pair">—</span>
            </div>
          </div>`);
          continue;
        }
        const g = rotationByGame[cell.game_in_match];
        if (!g) {
          rounds.push(`<div class="round${isCurrent ? ' current' : ''}">
            ${labelHtml(r, '')}
            <div class="matchup"><span class="vs">— missing rotation —</span></div>
          </div>`);
          continue;
        }
        const game = cell.game || g.game || null;
        const has = game && game.status === 'complete';
        const s1 = has ? Number(game.t1_score) : null;
        const s2 = has ? Number(game.t2_score) : null;
        const t1Win = has && s1 > s2;
        const t2Win = has && s2 > s1;
        const ln = name => `<span class="ln">${escapeHtml(firstLastInitial(name))}</span>`;
        const t1label = `${ln(g.t1_player_1.full_name)}${ln(g.t1_player_2.full_name)}`;
        const t2label = `${ln(g.t2_player_1.full_name)}${ln(g.t2_player_2.full_name)}`;
        const s1cls = !has ? 'score empty' : (t1Win ? 'score' : 'score lose');
        const s2cls = !has ? 'score empty' : (t2Win ? 'score' : 'score lose');
        const t1Cls = t1Win ? 'win' : (has ? 'lose' : '');
        const t2Cls = t2Win ? 'win' : (has ? 'lose' : '');
        rounds.push(`<div class="round${isCurrent ? ' current' : ''}">
          ${labelHtml(r, 'C' + cell.court_number)}
          <div class="matchup">
            <span class="pair ${t1Cls}">${t1label}</span>
            <span class="${s1cls}">${has ? s1 : ''}</span>
            <span class="vs">vs</span>
            <span class="${s2cls}">${has ? s2 : ''}</span>
            <span class="pair ${t2Cls}">${t2label}</span>
          </div>
        </div>`);
      }

      // Standings: 2 rows of 2 players (1st/2nd, then 3rd/4th). The
      // .standings-mini gets flex: 1 so it takes the same vertical space
      // as one round row, and the two .strow children split that height.
      const standings = (grp.standings || []).slice().sort((a, b) => a.rank - b.rank);
      const shortName = p => firstLastInitial(p.full_name);
      const playerCell = p =>
        `<span class="player">
          <span class="rank">${p.rank}.</span>
          <span class="name">${escapeHtml(shortName(p))}</span>
          <span class="record">${p.wins}-${p.losses}</span>
        </span>`;
      const row1 = standings.slice(0, 2).map(playerCell).join('');
      const row2 = standings.slice(2, 4).map(playerCell).join('');

      return `<div class="group-card">
        <div class="group-card-inner">
          <div class="group-header">
            <h3>Group ${grp.group_number}</h3>
          </div>
          ${rounds.join('')}
          <div class="standings-mini">
            <div class="strow">${row1}</div>
            <div class="strow">${row2}</div>
          </div>
        </div>
      </div>`;
    }

    /**
     * Build a session-info card to drop into the grid's empty slot when the
     * picker chose a layout with one (e.g. N=5 → 3×2, N=7 → 4×2). Returns ''
     * when there's no empty slot. Same outer shape as a group card so the
     * grid doesn't notice the difference.
     */
    function renderSessionInfoCard(s, best, N) {
      const empty = best.cols * best.rows - N;
      if (empty <= 0) return '';
      const games = `${s.games_played} / ${s.games_total}`;
      const pct = s.games_total ? Math.round((s.games_played / s.games_total) * 100) : 0;
      const leagueName = (CURRENT_LEAGUE && CURRENT_LEAGUE.name) || '';
      return `<div class="session-card">
        <div class="session-card-inner">
          ${leagueName ? `<div class="session-card-meta">${escapeHtml(leagueName)}</div>` : ''}
          <div class="session-card-headline">Week ${s.week_number}<br>${halfLabel(s.half)}</div>
          <div class="session-card-progress">${games} games · ${pct}%</div>
          <div class="session-card-clock" id="session-card-clock">${getNowDisplay()}</div>
        </div>
      </div>`;
    }

    function getNowDisplay() {
      const now = new Date();
      const h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h < 12 ? 'AM' : 'PM';
      const h12 = ((h + 11) % 12) + 1;
      return `${h12}:${m} ${ampm}`;

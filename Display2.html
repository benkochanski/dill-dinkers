    }

    // Tick the session card clock once a minute (the displayed format is
    // hour:minute, so per-second updates would just redraw the same string).
    setInterval(() => {
      const el = document.getElementById('session-card-clock');
      if (el) el.textContent = getNowDisplay();
    }, 30000);

    function onStandings(resp) {
      if (!resp.ok) return showErr(resp.error);
      const data = resp.data || [];
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      const c = document.getElementById('content');
      if (!data.length) {
        // For ladder leagues with no week/half active, the most likely cause
        // is that no session has been set up (or it was reset). Make that
        // explicit instead of the misleading "No completed games yet."
        if (CURRENT_LEAGUE.format_type === 'ladder' && (!CURRENT_WEEK || !CURRENT_HALF)) {
          c.innerHTML =
            '<div style="text-align:center; padding:60px 20px">' +
            '<h2 style="color:var(--brand-orange); margin:0 0 8px">Session not set up yet</h2>' +
            '<p class="meta" style="font-size:18px;margin:0">Start Half&nbsp;1 in the Operator to bring this scoreboard to life.</p>' +
            '</div>';
        } else {
          c.innerHTML = '<p class="meta">No completed games yet.</p>';
        }
        return;
      }
      // renderPartner returns its own .fit-wrap (it uses the dynamic
      // session-grid like ladder sessions); renderLadder still needs wrapping.
      c.innerHTML = (CURRENT_LEAGUE.format_type === 'partner')
        ? renderPartner(data)
        : '<div class="fit-wrap">' + renderLadder(data) + '</div>';
      requestAnimationFrame(fitToViewport);
    }

    function renderLadder(data) {
      const rows = data.map(s => `<tr>
        <td class="rank">${s.rank}</td>
        <td>${escapeHtml(s.full_name)}<br><span class="meta">${escapeHtml(s.level || '')}</span></td>
        <td>${s.wins} / ${s.games_played}</td>
        <td>${(s.win_pct * 100).toFixed(1)}%</td>
        <td><span class="pf">${s.points}</span> / ${s.games_played * 11}</td>
        <td>${(s.point_pct * 100).toFixed(1)}%</td>
        <td><strong>${s.score.toFixed(1)}</strong></td>
      </tr>`).join('');
      return `<h2>Season standings</h2>
        <table>
          <tr><th>#</th><th>Player</th><th>Wins</th><th>W%</th><th>Points</th><th>P%</th><th>Score</th></tr>
          ${rows}
        </table>`;
    }

    function renderPartner(data, seasonStandings) {
      // Lock card order to team-name alphabetical. Sorting by rank made cards
      // shuffle every time a score was entered, which was disorienting on the
      // TV mid-session.
      const sorted = (data || []).slice().sort((a, b) =>
        String(a.team_name || '').localeCompare(String(b.team_name || '')));
      const N = sorted.length || 1;
      // Grid lives in the LEFT 1.6/2.6 of the viewport when standings show.
      const hasStandings = (seasonStandings && seasonStandings.length);
      const vw = window.innerWidth || 1920;
      const gridWidth = hasStandings ? vw * (1.6 / 2.6) : vw;
      const best = pickGridLayout(N, gridWidth, (window.innerHeight || 1080));
      const cards = sorted.map(s => renderTeamCard(s)).join('');
      // Drop a session-info card into the empty slot when the picker leaves
      // one (e.g. N=5 → 3×2, N=7 → 4×2, N=11 → 4×3, N=13 → 5×3 has two empty).
      const empty = best.cols * best.rows - N;
      let extra = '';
      if (empty > 0) {
        const leagueName = (CURRENT_LEAGUE && CURRENT_LEAGUE.name) || '';
        extra = `<div class="session-card"><div class="session-card-inner">
          ${leagueName ? `<div class="session-card-meta">${escapeHtml(leagueName)}</div>` : ''}
          <div class="session-card-headline">${N} teams</div>
          <div class="session-card-clock" id="session-card-clock">${getNowDisplay()}</div>
        </div></div>`;
      }
      const grid = `<div class="session-grid" style="--cols:${best.cols}">${cards}${extra}</div>`;
      const body = hasStandings
        ? `<div class="session-with-standings">${grid}${renderPartnerStandingsPanel(seasonStandings)}</div>`
        : grid;
      return `<div class="fit-wrap">${body}</div>`;
    }

    // Partner-format season standings: full table with rank · team · W-L ·
    // Pct · GB · +/-. Team cell stacks team name + player names. Rows are
    // flex: 1 so the table fills the panel vertically.
    function renderPartnerStandingsPanel(standings) {
      const rankCls = r => r === 1 ? ' r1' : r === 2 ? ' r2' : r === 3 ? ' r3' : (r == null ? ' rNR' : '');
      const head = `<div class="standings-side-row head partner-full">
        <span class="title">Season Standings</span>
        <span class="wl">W-L</span>
        <span class="pct">Pct</span>
        <span class="gb">GB</span>
        <span class="pd">+/-</span>
      </div>`;
      const rows = (standings || []).map(s => {
        const wins = s.wins || 0, losses = s.losses || 0;
        const total = wins + losses;
        const pct = total ? wins / total : 0;
        const pctStr = pct.toFixed(3).replace(/^0\./, '.');
        const gb = Number(s.games_back || 0);
        const gbStr = gb > 0 ? gb.toFixed(1) : '—';
        const pd = Number(s.point_diff || 0);
        const pdStr = pd > 0 ? `+${pd}` : `${pd}`;
        const pdCls = pd > 0 ? 'pos' : pd < 0 ? 'neg' : '';
        const players = [s.player_1_name, s.player_2_name].filter(Boolean).join(' · ');
        const rkStr = s.rank == null ? '—' : s.rank;
        return `<div class="standings-side-row partner-full${rankCls(s.rank)}">
          <span class="rk">${rkStr}</span>
          <span class="nm">
            <div class="team-nm">${escapeHtml(s.team_name || '')}</div>
            ${players ? `<div class="team-sub">${escapeHtml(players)}</div>` : ''}
          </span>
          <span class="wl">${wins}-${losses}</span>
          <span class="pct">${pctStr}</span>
          <span class="gb">${gbStr}</span>
          <span class="pd ${pdCls}">${pdStr}</span>
        </div>`;
      }).join('');
      return `<div class="standings-side-panel">
        <div class="standings-side-panel-body">
          <div class="standings-side-section season">
            <div class="standings-side-list">${head}${rows}</div>
          </div>
        </div>
      </div>`;
    }

    function renderTeamCard(s) {
      const games = (s.wins || 0) + (s.losses || 0);
      const ppg = games > 0 ? ((s.point_diff || 0) / games) : 0;
      const ppgStr = `${ppg > 0 ? '+' : ''}${ppg.toFixed(1)} PPG`;
      const gb = (s.games_back || 0).toFixed(1);
      const standingsLine = `${ordinal(s.rank)} Place &nbsp;|&nbsp; ${s.wins||0} - ${s.losses||0} &nbsp;|&nbsp; ${gb} Game(s) Back &nbsp;|&nbsp; ${ppgStr}`;

      // Optional per-session fields. Server can populate these later; the card
      // gracefully omits the band if absent.
      //   today_record: "1 - 3"
      //   today_rounds: [{ round, kind: 'played'|'scheduled'|'bye', ... }, ...]
      // Rounds render in their fixed sequence so a bye stays in its original
      // slot — operators were confused when entering scores reshuffled the
      // round order on the card.
      const todayRecord = s.today_record || '';
      const rounds = Array.isArray(s.today_rounds) ? s.today_rounds : [];

      const roundsHtml = rounds.map(r => {
        const tag = `R${r.round}`;
        if (r.kind === 'bye') {
          return `<div class="result upcoming"><span class="result-icon">${tag}</span><span>Bye</span></div>`;
        }
        if (r.kind === 'scheduled') {
          const opp = r.opponent_rank ? `${escapeHtml(r.opponent)} (${ordinal(r.opponent_rank)})` : escapeHtml(r.opponent || '');
          const court = r.court ? `Court ${r.court} vs. ` : 'vs. ';
          return `<div class="result upcoming"><span class="result-icon">${tag}</span><span>${court}${opp}</span></div>`;
        }
        // played
        const verb = r.won ? 'Beat' : 'Lost to';
        const cls = r.won ? 'win' : 'loss';
        const score = (r.our_score != null && r.their_score != null)
          ? ` ${Math.max(r.our_score, r.their_score)}-${Math.min(r.our_score, r.their_score)}`
          : '';
        const opp = r.opponent_rank ? `${escapeHtml(r.opponent)} (${ordinal(r.opponent_rank)})` : escapeHtml(r.opponent || '');
        return `<div class="result"><span class="result-icon ${cls}">${tag}</span><span>${verb} ${opp}${score}</span></div>`;
      }).join('');

      const showResults = !!roundsHtml;

      return `<div class="team-card"><div class="team-card-inner">
        <div class="team-card-name">${escapeHtml(s.team_name || '')}</div>
        <div class="team-card-players">${escapeHtml(s.player_1_name || '')} &amp; ${escapeHtml(s.player_2_name || '')}</div>
        <div class="team-card-standings">${standingsLine}</div>
        ${todayRecord ? `<div class="team-card-today">Today: ${escapeHtml(todayRecord)}</div>` : ''}
        ${showResults ? `<div class="team-card-results">${roundsHtml}</div>` : ''}
      </div></div>`;
    }

    function ordinal(n) {
      if (n == null) return '';
      const s = ['th', 'st', 'nd', 'rd'];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    init();
  </script>
</body>
</html>
